<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<title>Dom Gabriel · Sistema</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#1F3A5F;--navy2:#2c4f7c;--gold:#C9A227;--bg:#F4F5F7;--card:#fff;--txt:#1d2733;--mut:#6b7684;--bd:#e2e6ea;
--quente:#c62828;--morna:#e08e0b;--fria:#1e6fb8;--ok:#2e7d32}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--navy);color:#fff}
button.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}button.link{background:none;color:var(--navy);padding:4px 6px}
button.gold{background:var(--gold);color:#1d2733}button.del{background:none;color:#b00;padding:4px 8px}
input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--txt)}
input:disabled,select:disabled,textarea:disabled{background:#f2f3f5;color:#555}
textarea{min-height:60px;resize:vertical}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.hide{display:none!important}.mut{color:var(--mut);font-size:13px}
/* layout */
#topo{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
#topo b{font-size:16px}#topo small{color:#cfd8e3}
#corpo{display:flex;min-height:calc(100% - 52px)}
#menu{width:220px;background:#fff;border-right:1px solid var(--bd);padding:12px 8px;flex-shrink:0}
#menu a{display:block;padding:10px 12px;border-radius:8px;color:var(--txt);text-decoration:none;margin-bottom:2px}
#menu a.on{background:#eef3f9;color:var(--navy);font-weight:bold}
#conteudo{flex:1;padding:16px;max-width:1200px;margin:0 auto;width:100%;padding-bottom:90px}
#menuMob{display:none}
@media (max-width:800px){#menu{display:none}#menuMob{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
#menuMob a{flex:1;text-align:center;padding:10px 4px;font-size:12px;color:var(--mut);text-decoration:none}#menuMob a.on{color:var(--navy);font-weight:bold}#conteudo{padding:12px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px;color:var(--navy)}
.linha{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
@media (max-width:800px){.g2,.g3{grid-template-columns:1fr}}
.pill{display:inline-block;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:bold;color:#fff}
.kpi .pill{color:#fff!important;font-size:13px}.Quente{background:var(--quente)}.Morna{background:var(--morna)}.Fria{background:var(--fria)}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.capaCard{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px;cursor:pointer}
.capaCard:hover{border-color:var(--navy2)}
.capaCard .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.atras{color:var(--quente);font-weight:bold}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--bd);margin:8px 0 12px;scrollbar-width:none}
.tabs a{padding:9px 12px;white-space:nowrap;color:var(--mut);text-decoration:none;border-bottom:3px solid transparent}
.tabs a.on{color:var(--navy);border-color:var(--gold);font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}th{color:var(--mut);font-weight:normal;font-size:12px}
.tbl{overflow-x:auto}
.item{border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:8px;background:#fff}
.sug{border:1px solid var(--bd);border-radius:8px;max-height:260px;overflow:auto;background:#fff}
.sug div{padding:8px 10px;border-bottom:1px solid var(--bd);cursor:pointer}.sug div:hover{background:#f5f7fa}
.kpis{display:flex;gap:10px;flex-wrap:wrap}.kpi{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:8px 12px}.kpi b{display:block;font-size:17px;color:var(--navy)}.kpi span{font-size:12px;color:var(--mut)}
#toast{position:fixed;right:16px;bottom:80px;background:#1d2733;color:#fff;padding:9px 14px;border-radius:8px;opacity:0;transition:.2s;z-index:50;font-size:14px}
#toast.on{opacity:.93}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;z-index:40;padding:40px 12px;overflow:auto}
.modal .card{max-width:520px;width:100%}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.chk input[type=checkbox]{width:22px;height:22px;flex-shrink:0}
.chk .txt{flex:1}.chk input[type=date]{width:150px}
#login{max-width:380px;margin:60px auto}
.aviso{background:#fff4e0;color:#8a5200;padding:8px 10px;border-radius:8px;font-size:13px;margin:6px 0}
.erro{background:#fdecea;color:#b00;padding:8px 10px;border-radius:8px;font-size:13px;margin:6px 0}
</style>
</head>
<body>
<div id="topo"><div><b>Dom Gabriel</b> <small>· Sistema interno</small></div><div id="quem" class="mut" style="color:#cfd8e3"></div></div>

<div id="login" class="card">
  <h3>Entrar</h3>
  <label>E-mail</label><input id="lEmail" type="email" autocomplete="username">
  <label>Senha</label><input id="lSenha" type="password" autocomplete="current-password">
  <div id="lNomeBox" class="hide"><label>Seu nome completo</label><input id="lNome"></div>
  <div class="linha" style="margin-top:12px"><button id="bEntrar">Entrar</button><button class="sec" id="bCriar">Criar meu acesso</button></div>
  <div id="lMsg"></div>
</div>

<div id="corpo" class="hide">
  <nav id="menu"></nav>
  <main id="conteudo"></main>
</div>
<nav id="menuMob" class="hide"></nav>
<div id="toast"></div>
<div id="modal"></div>

<script>
const sb = supabase.createClient('https://vmpxssoyqfdnnyhnvkyl.supabase.co','sb_publishable_NXQa66tcvLT7k_uib2UAeg_E0as2h7M');
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dBR = d => d ? new Date(d + (d.length===10?'T12:00:00':'')).toLocaleDateString('pt-BR') : '';
const hoje = () => new Date().toISOString().slice(0,10);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600);}
function erro(e){ console.error(e); toast('Erro: '+(e.message||e)); }
window.addEventListener('unhandledrejection',e=>erro(e.reason||e));

let EU=null, LOJAS=[], OP={}, CAPA=null;
const ehDirecao = () => ['admin','direcao'].includes(EU?.papel);

// ================= LOGIN =================
let modoCriar=false;
$('#bCriar').onclick=async()=>{
  if(!modoCriar){modoCriar=true;$('#lNomeBox').classList.remove('hide');$('#bCriar').textContent='Enviar cadastro';return;}
  const {error}=await sb.auth.signUp({email:$('#lEmail').value.trim(),password:$('#lSenha').value,options:{data:{nome:$('#lNome').value.trim()}}});
  $('#lMsg').innerHTML = error ? `<div class="erro">${esc(error.message)}</div>` : `<div class="aviso">Cadastro enviado. Confirme pelo e-mail e aguarde a direção liberar seu acesso.</div>`;
};
$('#bEntrar').onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$('#lEmail').value.trim(),password:$('#lSenha').value});
  if(error) return $('#lMsg').innerHTML=`<div class="erro">Não foi possível entrar: ${esc(error.message)}</div>`;
  iniciar();
};
$('#lSenha').addEventListener('keydown',e=>{if(e.key==='Enter')$('#bEntrar').click()});

async function iniciar(){
  const {data:{user}}=await sb.auth.getUser(); if(!user) return;
  const {data:eu}=await sb.from('usuarios').select('*').eq('id',user.id).maybeSingle();
  if(!eu||!eu.ativo){ $('#lMsg').innerHTML='<div class="aviso">Seu acesso ainda não foi liberado pela direção.</div>'; await sb.auth.signOut(); return; }
  EU=eu;
  const [{data:lj},{data:op}]=await Promise.all([sb.from('lojas').select('*').order('id'), sb.from('listas_opcoes').select('lista,valor,ordem').eq('ativo',true).order('ordem')]);
  LOJAS=lj||[]; OP={}; (op||[]).forEach(o=>(OP[o.lista]=OP[o.lista]||[]).push(o.valor));
  $('#login').classList.add('hide'); $('#corpo').classList.remove('hide'); $('#menuMob').classList.remove('hide');
  $('#quem').innerHTML=`${esc(eu.nome)} · ${esc(eu.papel)} <button class="link" style="color:#fff" id="sair">Sair</button>`;
  $('#sair').onclick=async()=>{await sb.auth.signOut();location.hash='';location.reload();};
  montarMenu(); rota();
}
sb.auth.getSession().then(({data})=>{ if(data.session) iniciar(); });

// ================= NAVEGAÇÃO =================
function montarMenu(){
  const itens=[['#/capas','Capas'],['#/nova','+ Nova capa']]; if(ehDirecao()) itens.push(['#/usuarios','Usuários']);
  $('#menu').innerHTML=itens.map(([h,t])=>`<a href="${h}">${t}</a>`).join('')+`<p class="mut" style="padding:12px">Loja: ${esc(LOJAS.find(l=>l.id===EU.loja_id)?.codigo||'-')}</p>`;
  $('#menuMob').innerHTML=itens.map(([h,t])=>`<a href="${h}">${t}</a>`).join('');
}
window.addEventListener('hashchange',rota);
function rota(){
  if(!EU) return; const h=location.hash||'#/capas';
  document.querySelectorAll('#menu a,#menuMob a').forEach(a=>a.classList.toggle('on',h.startsWith(a.getAttribute('href'))));
  if(h.startsWith('#/capa/')) return abrirCapa(h.split('/')[2]);
  if(h==='#/nova') return novaCapa();
  if(h==='#/usuarios') return telaUsuarios();
  telaLista();
}
const sel=(lista,val,attrs='')=>`<select ${attrs}><option value=""></option>${(OP[lista]||[]).map(v=>`<option ${v===val?'selected':''}>${esc(v)}</option>`).join('')}</select>`;

// ================= LISTA DE CAPAS =================
let filtro={escopo:'minhas',status:'abertas',busca:''};
async function telaLista(){
  $('#conteudo').innerHTML=`
  <div class="linha" style="justify-content:space-between"><h2 style="margin:4px 0;color:var(--navy)">Capas de atendimento</h2><button class="gold" onclick="location.hash='#/nova'">+ Nova capa</button></div>
  <div class="card"><div class="g3">
    <div><label>Buscar (nome, WhatsApp, endereço, nº)</label><input id="fBusca" value="${esc(filtro.busca)}" placeholder="ex.: Juliana, 66999…, Rua…"></div>
    <div><label>Mostrar</label><select id="fEscopo"><option value="minhas">Minhas capas</option><option value="loja">Todas da loja</option>${ehDirecao()?'<option value="todas">Todas as lojas</option>':''}</select></div>
    <div><label>Status</label><select id="fStatus"><option value="abertas">Em andamento</option><option value="todas">Todos</option>${(OP.status_capa||[]).map(s=>`<option>${esc(s)}</option>`).join('')}</select></div>
  </div></div>
  <div id="kpis" class="kpis" style="margin-bottom:12px"></div>
  <div id="res" class="lista"><p class="mut">Carregando…</p></div>`;
  $('#fEscopo').value=filtro.escopo; $('#fStatus').value=filtro.status;
  let t; $('#fBusca').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{filtro.busca=e.target.value;carregarLista()},300)};
  $('#fEscopo').onchange=e=>{filtro.escopo=e.target.value;carregarLista()};
  $('#fStatus').onchange=e=>{filtro.status=e.target.value;carregarLista()};
  carregarLista();
}
async function carregarLista(){
  let q=sb.from('vw_capas_lista').select('*').order('proximo_passo_data',{ascending:true,nullsFirst:false}).limit(300);
  if(filtro.escopo==='minhas') q=q.eq('vendedor_id',EU.id);
  else if(filtro.escopo==='loja') q=q.eq('loja_id',EU.loja_id);
  if(filtro.status==='abertas') q=q.in('status',['Aberta','Em orçamento']);
  else if(filtro.status!=='todas') q=q.eq('status',filtro.status);
  const b=filtro.busca.trim().toLowerCase(); if(b) q=q.ilike('busca','%'+b.replace(/[%_]/g,'')+'%');
  const {data,error}=await q; if(error) return erro(error);
  const tot=data.reduce((s,c)=>s+Number(c.valor_em_negociacao||0),0), atras=data.filter(c=>c.proximo_passo_atrasado).length;
  const cnt=t=>data.filter(c=>c.temperatura===t).length;
  $('#kpis').innerHTML=`<div class="kpi"><b>${data.length}</b><span>capas</span></div><div class="kpi"><b>${brl(tot)}</b><span>em negociação (quentes)</span></div>
    <div class="kpi"><b><span class="pill Quente">${cnt('Quente')}</span> <span class="pill Morna">${cnt('Morna')}</span> <span class="pill Fria">${cnt('Fria')}</span></b><span>quentes · mornas · frias</span></div>
    <div class="kpi"><b class="${atras?'atras':''}">${atras}</b><span>próximo passo atrasado</span></div>`;
  $('#res').innerHTML = data.length ? data.map(c=>`
    <div class="capaCard" onclick="location.hash='#/capa/${c.id}'">
      <div class="t"><b>${esc(c.pessoas_nomes||'(sem cliente vinculado)')}</b><span class="pill ${c.temperatura}">${c.temperatura}</span></div>
      <div class="mut">${esc(c.numero)} · ${esc(c.status)} · ${esc(c.vendedor_nome||'')}</div>
      <div class="mut">${esc([c.endereco,c.bairro].filter(Boolean).join(' – ')||'obra sem endereço')}${c.etapa?' · '+esc(c.etapa):''}</div>
      <div style="margin-top:6px">${c.valor_em_negociacao>0?`<b>${brl(c.valor_em_negociacao)}</b> em negociação · `:''}
        <span class="${c.proximo_passo_atrasado?'atras':''}">${c.proximo_passo?`Próximo: ${esc(c.proximo_passo)}${c.proximo_passo_data?' ('+dBR(c.proximo_passo_data)+')':''}`:'<span class="atras">sem próximo passo</span>'}</span></div>
    </div>`).join('') : '<p class="mut">Nenhuma capa encontrada.</p>';
}

// ================= NOVA CAPA =================
function novaCapa(){
  $('#conteudo').innerHTML=`<div class="card" style="max-width:560px">
    <h3>Nova Capa de Atendimento</h3>
    <label>Loja</label><select id="nLoja" ${ehDirecao()?'':'disabled'}>${LOJAS.map(l=>`<option value="${l.id}" ${l.id===EU.loja_id?'selected':''}>${esc(l.codigo)} – ${esc(l.nome)}</option>`).join('')}</select>
    <label>Tipo de entrada</label>${sel('tipo_entrada','','id="nTipo"')}
    <label>Origem do cliente</label>${sel('origem','','id="nOrigem"')}
    <label>Detalhe da origem (quem indicou, qual arquiteto…)</label><input id="nDet">
    <label>Endereço da obra (se já souber)</label><input id="nEnd">
    <div class="linha" style="margin-top:14px"><button class="gold" id="nCriar">Criar capa</button><button class="sec" onclick="history.back()">Cancelar</button></div>
    <div id="nMsg"></div></div>`;
  $('#nCriar').onclick=async()=>{
    if(!$('#nTipo').value||!$('#nOrigem').value) return $('#nMsg').innerHTML='<div class="erro">Informe o tipo de entrada e a origem.</div>';
    const loja=+$('#nLoja').value;
    const {data:ob,error:e1}=await sb.from('obras').insert({loja_id:loja,endereco:$('#nEnd').value||null,criado_por:EU.id}).select().single(); if(e1) return erro(e1);
    const {data:c,error:e2}=await sb.from('capas').insert({loja_id:loja,obra_id:ob.id,vendedor_id:EU.id,tipo_entrada:$('#nTipo').value,origem:$('#nOrigem').value,origem_detalhe:$('#nDet').value||null}).select().single(); if(e2) return erro(e2);
    await sb.from('atividades').insert({capa_id:c.id,obra_id:ob.id,usuario_id:EU.id,loja_id:loja,tipo:$('#nTipo').value==='Prospecção ativa'?'Mapeamento de obra':'Visita do cliente à loja',resumo:'Abertura da capa'});
    toast('Capa '+c.numero+' criada'); location.hash='#/capa/'+c.id;
  };
}

// ================= CAPA =================
let abaAtual='quem';
async function abrirCapa(id){
  $('#conteudo').innerHTML='<p class="mut">Carregando capa…</p>';
  const {data:c,error}=await sb.from('capas').select('*').eq('id',id).single(); if(error) return erro(error);
  const {data:ob}=c.obra_id?await sb.from('obras').select('*').eq('id',c.obra_id).single():{data:null};
  CAPA={c,ob,podeEditar: ehDirecao() || c.vendedor_id===EU.id || (EU.papel==='gerente'&&c.loja_id===EU.loja_id)};
  const vend=c.vendedor_id?(await sb.from('usuarios').select('nome').eq('id',c.vendedor_id).maybeSingle()).data:null;
  const dis=CAPA.podeEditar?'':'disabled';
  $('#conteudo').innerHTML=`
   <div class="linha" style="justify-content:space-between"><button class="link" onclick="location.hash='#/capas'">← Capas</button><span class="mut">${CAPA.podeEditar?'':'Somente leitura (capa de outro vendedor) — você pode registrar produtos vistos e contatos.'}</span></div>
   <div class="card">
     <div class="linha" style="justify-content:space-between"><div><b style="font-size:18px">${esc(c.numero)}</b> <span class="mut">· aberta em ${dBR(c.data_abertura)} · ${esc(vend?.nome||'')}</span></div><div id="resumo"></div></div>
     <div class="g3">
       <div><label>Status</label>${sel('status_capa',c.status,`data-t="capas" data-f="status" ${dis}`)}</div>
       <div><label>Próximo passo (obrigatório)</label><input data-t="capas" data-f="proximo_passo" value="${esc(c.proximo_passo)}" ${dis}></div>
       <div><label>Data do próximo passo</label><input type="date" data-t="capas" data-f="proximo_passo_data" value="${c.proximo_passo_data||''}" ${dis}></div>
     </div>
     <div id="perdaBox" class="${c.status==='Perdida'?'':'hide'}"><label>Motivo da perda</label>${sel('motivo_perda',c.motivo_perda,`data-t="capas" data-f="motivo_perda" ${dis}`)}</div>
   </div>
   <div class="tabs">${[['quem','Quem e onde'],['bant','Qualificação'],['produtos','Produtos vistos'],['check','Checklist'],['orc','Orçamentos'],['tempo','Linha do tempo']].map(([k,t])=>`<a href="#" data-aba="${k}" class="${k===abaAtual?'on':''}">${t}</a>`).join('')}</div>
   <div id="aba"></div>`;
  document.querySelectorAll('.tabs a').forEach(a=>a.onclick=e=>{e.preventDefault();abaAtual=a.dataset.aba;document.querySelectorAll('.tabs a').forEach(x=>x.classList.toggle('on',x===a));renderAba();});
  ligarCampos($('#conteudo')); atualizarResumo(); renderAba();
}
function ligarCampos(root){
  root.querySelectorAll('[data-t][data-f]').forEach(el=>{
    if(el._lig) return; el._lig=1;
    el.addEventListener('change',async()=>{
      const t=el.dataset.t, f=el.dataset.f; let v=el.type==='checkbox'?el.checked:el.value; if(v==='') v=null;
      if(el.type==='number'&&v!==null) v=Number(v);
      if(t==='capas'&&f==='falou_com_decisor') v = v===null?null:v==='Sim';
      const id = t==='capas'?CAPA.c.id : t==='obras'?CAPA.ob.id : el.dataset.id;
      const {error}=await sb.from(t).update({[f]:v}).eq('id',id); if(error) return erro(error);
      if(t==='capas'){CAPA.c[f]=v; if(f==='status') $('#perdaBox').classList.toggle('hide',v!=='Perdida');}
      toast('Salvo ✓'); atualizarResumo();
    });
  });
}
async function atualizarResumo(){
  const {data:r}=await sb.from('vw_capas_resumo').select('*').eq('id',CAPA.c.id).maybeSingle(); if(!r) return;
  $('#resumo').innerHTML=`<span class="pill ${r.temperatura}" title="BANT: B${r.bant_b} A${r.bant_a} N${r.bant_n} T${r.bant_t}">${r.temperatura} · ${r.pontos}/4</span>
   ${r.valor_em_negociacao>0?` <b style="margin-left:8px">${brl(r.valor_em_negociacao)}</b> <span class="mut">em negociação</span>`:''}`;
}
function renderAba(){ ({quem:abaQuem,bant:abaBant,produtos:abaProdutos,check:abaCheck,orc:abaOrc,tempo:abaTempo})[abaAtual](); }

// ---------- Quem e onde ----------
async function abaQuem(){
  const {c,ob,podeEditar}=CAPA; const dis=podeEditar?'':'disabled';
  const {data:vs}=await sb.from('obra_pessoas').select('papel,decide,pessoa:pessoas(*)').eq('obra_id',ob.id);
  $('#aba').innerHTML=`

const PDFJS_V='3.11.174';
let _pdfjs=null;
async function carregarPdfjs(){
  if(_pdfjs) return _pdfjs;
  await new Promise((ok,falha)=>{const s=document.createElement('script');s.src=`https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_V}/build/pdf.min.js`;s.onload=ok;s.onerror=()=>falha(new Error('Não consegui carregar o leitor de PDF'));document.head.appendChild(s);});
  _pdfjs=window.pdfjsLib; _pdfjs.GlobalWorkerOptions.workerSrc=`https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_V}/build/pdf.worker.min.js`;
  return _pdfjs;

// ===== Leitor de orçamento Santri (usa pdf.js). Funciona no navegador e no node =====
async function lerOrcamentoPDF(pdfjsLib, data){
  const doc = await pdfjsLib.getDocument({data}).promise;
  const linhas=[];
  for(let p=1;p<=doc.numPages;p++){
    const pg=await doc.getPage(p); const tc=await pg.getTextContent();
    const its=tc.items.filter(i=>i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4],y:Math.round(i.transform[5]),w:i.width}));
    const porY={}; its.forEach(i=>{const k=Object.keys(porY).find(y=>Math.abs(y-i.y)<=2); (porY[k??i.y]=porY[k??i.y]||[]).push(i);});
    Object.keys(porY).map(Number).sort((a,b)=>b-a).forEach(y=>linhas.push({pag:p,y,its:porY[y].sort((a,b)=>a.x-b.x)}));
  }
  const txt=l=>l.its.map(i=>i.s).join(' ');
  const num=s=>{s=String(s||'').trim();if(!s)return null;return Number(s.replace(/\./g,'').replace(',','.'))};
  const todo=linhas.map(txt).join('\n');
  const pega=(re)=>{const m=todo.match(re);return m?m[1].trim():null};
  const dt=s=>{const m=String(s||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?`${m[3]}-${m[2]}-${m[1]}`:null};
  const cab={
    numero: pega(/Orçamento:\s*([\d.]+)/), data_emissao: dt(pega(/Data emissão:\s*([\d\/]+)/)), data_validade: dt(pega(/Data de validade:\s*([\d\/]+)/)),
    vendedor: pega(/Vendedor:\s*(.+?)(?:\s+Fone|\n|$)/), condicao_pagamento: pega(/Condição de pagamento:\s*(.+)/),
    cliente: pega(/Cliente:\s*(.+?)(?:\s+A\/C:|\n|$)/), loja: pega(/DOM GABRIEL[^\n]*?-\s*(PVA|RV)/)
  };
  // colunas pelo cabeçalho da tabela
  const hl=linhas.find(l=>/Cod\. original/.test(txt(l)) && /Total/.test(txt(l)));
  if(!hl) throw new Error('Não encontrei a tabela de produtos neste PDF. É um orçamento do Santri?');
  const col={}; hl.its.forEach(i=>{const k=i.s.toLowerCase();
    if(k.startsWith('cod'))col.cod=i.x; else if(k==='produto')col.prod=i.x; else if(k.startsWith('descri'))col.desc=i.x; else if(k==='marca')col.marca=i.x;
    else if(k==='und')col.und=i.x; else if(k.startsWith('qtd'))col.qtd=i.x+i.w; else if(k.startsWith('preco'))col.preco=i.x+i.w; else if(k==='total')col.total=i.x+i.w;});
  const itens=[]; let amb=null; let ordem=0;
  const hdrIdx=linhas.indexOf(hl);
  for(const l of linhas.slice(hdrIdx+1)){
    const t=txt(l);
    if(/^TOTAIS/.test(t)||/Total produtos\s*$/.test(t)) break;
    if(/Cod\. original|Emitido em|ADM \d|Página:/.test(t)) continue;
    if(/Total produtos:/.test(t)) continue;
    // linha de item: tem número no fim (total) alinhado à coluna Total
    const ult=l.its[l.its.length-1];
    const temTotal = /^[\d.]+,\d{2}$/.test(ult.s) && Math.abs((ult.x+ult.w)-col.total)<40;
    if(temTotal && l.its.length>=6){
      const r=l.its; const nums=r.filter(i=>/^[\d.]+,\d+$/.test(i.s));
      const total=num(nums[nums.length-1].s), preco=num(nums[nums.length-2].s), qtd=num(nums[nums.length-3].s);
      const und=r.find(i=>Math.abs(i.x-col.und)<25 && /^[A-ZÇ]{1,4}\d?$/.test(i.s));
      const marca=r.filter(i=>i.x>=col.marca-5 && i.x<col.und-5).map(i=>i.s).join(' ');
      const desc=r.filter(i=>i.x>=col.desc-5 && i.x<col.marca-5).map(i=>i.s).join(' ');
      const pre=r.filter(i=>i.x<col.desc-5).map(i=>i.s).filter(s=>s!=='(*)');
      const codProd=pre.length?pre[pre.length-1]:null, codOrig=pre.length>1?pre[0].replace(/^\(\*\)\s*/,''):null;
      itens.push({ordem:++ordem,ambiente:amb,sob_encomenda:r.some(i=>i.s.startsWith('(*)')),codigo_original:codOrig,produto_id:codProd&&/^[\d.]+$/.test(codProd)?Number(codProd.replace(/\./g,'')):null,
        descricao:desc,marca,unidade:und?und.s:null,quantidade:qtd,preco_unitario:preco,total});
    } else if(!/\d{2}\/\d{2}\/\d{4}/.test(t) && l.its.every(i=>i.x>=col.prod-10 && i.x<col.marca+60)) {
      amb=t.trim();
    }
  }
  const tg=todo.match(/TOTAL GERAL[\s\S]*?([\d.]+,\d{2})\s*$/m); 
  const totalLinhas=linhas.map(txt); let totalGeral=null;
  const iTG=totalLinhas.findIndex(s=>/TOTAL GERAL/.test(s)); if(iTG>=0){ for(let k=iTG;k<Math.min(iTG+3,totalLinhas.length);k++){ const m=totalLinhas[k].match(/([\d.]+,\d{2})\s*$/); if(m){totalGeral=num(m[1]);} } }
  return {cabecalho:cab,itens,total_geral:totalGeral ?? itens.reduce((s,i)=>s+i.total,0)};
}
// sugere grupos de opções: mesmo ambiente + mesma unidade + mesma quantidade
function sugerirOpcoes(itens){
  const grupos={}; let g=0;
  const chave=i=>`${i.ambiente}|${i.unidade}|${(i.quantidade||0).toFixed(3)}`;
  const cont={}; itens.forEach(i=>cont[chave(i)]=(cont[chave(i)]||0)+1);
  itens.forEach(i=>{ const k=chave(i); if(cont[k]>1){ if(!grupos[k]) grupos[k]=++g; i.grupo_opcao=grupos[k];
     i.opcao_confirmada=/OP[ÇC]/i.test(i.ambiente||''); } else { i.grupo_opcao=null; i.opcao_confirmada=false; } });
  // escolhido padrão: em cada grupo, o mais barato
  Object.values(grupos).forEach(gid=>{ const gs=itens.filter(i=>i.grupo_opcao===gid); const m=gs.reduce((a,b)=>b.total<a.total?b:a); gs.forEach(i=>i.escolhido=(i===m)); });
  itens.forEach(i=>{ if(i.grupo_opcao==null) i.escolhido=true; });
  return itens;
}
// valor provável: itens sem grupo + escolhido de cada grupo confirmado; grupo não confirmado conta tudo
function valorProvavel(itens){
  return itens.reduce((s,i)=> s + ( i.grupo_opcao==null ? i.total : (i.opcao_confirmada ? (i.escolhido?i.total:0) : i.total) ), 0);
}

    const L=itens.filter(i=>(i.ambiente||'(sem ambiente)')===a);

      ${grupos.map(g=>{const G=L.filter(i=>i.grupo_opcao===g);const conf=G[0].opcao_confirmada;
        return `<div class="item" style="border-color:${conf?'var(--gold)':'#aab4c0'};background:${conf?'#fffaf0':'#f7f9fc'}">

          ${G.map(i=>`<label style="display:flex;gap:8px;align-items:center;margin:4px 0;color:var(--txt)">

        </div>`}).join('')}

function ligarBlocoItens(root, itens, rerender){
  root.querySelectorAll('[data-esc]').forEach(r=>r.onchange=()=>{const it=itens.find(i=>i.ordem==r.dataset.esc);itens.filter(i=>i.grupo_opcao===it.grupo_opcao).forEach(i=>i.escolhido=(i===it));rerender();});
  root.querySelectorAll('[data-sair]').forEach(b=>b.onclick=e=>{e.preventDefault();const it=itens.find(i=>i.ordem==b.dataset.sair);const g=it.grupo_opcao;
    it.grupo_opcao=null;it.opcao_confirmada=false;it.escolhido=true;const R=itens.filter(i=>i.grupo_opcao===g);
    if(R.length<2) R.forEach(i=>{i.grupo_opcao=null;i.opcao_confirmada=false;i.escolhido=true;}); else if(!R.some(i=>i.escolhido)){const m=R.reduce((a,c)=>c.total<a.total?c:a);m.escolhido=true;}
    rerender();});
  root.querySelectorAll('[data-conf]').forEach(b=>b.onclick=()=>{const g=+b.dataset.conf;const G=itens.filter(i=>i.grupo_opcao===g);
    if(b.dataset.v==='1'){G.forEach(i=>i.opcao_confirmada=true);} else {G.forEach(i=>{i.opcao_confirmada=false;i.grupo_opcao=null;i.escolhido=true;});}
    rerender();});
}

async function salvarOrcamento(reg, itens, existentes){

  if(existentes&&existentes.length){ await sb.from('orcamentos').update({status:'Substituído (nova versão)',quente:false}).in('id',existentes.map(e=>e.id)); }
  const {data:o,error}=await sb.from('orcamentos').insert(reg).select().single();
  if(error){ erro(error.code==='23505'?{message:'Já existe um orçamento quente neste momento. Salve como "não quente" ou desmarque o outro.'}:error); return false; }
  if(itens&&itens.length){
    const ids=[...new Set(itens.map(i=>i.produto_id).filter(Boolean))];
    const {data:exist}=ids.length?await sb.from('produtos').select('id').in('id',ids):{data:[]};
    const ok=new Set((exist||[]).map(x=>x.id));
    const rows=itens.map(i=>({orcamento_id:o.id,ordem:i.ordem,ambiente:i.ambiente,ambiente_com_opcoes:/OP[ÇC]/i.test(i.ambiente||''),produto_id:ok.has(i.produto_id)?i.produto_id:null,
      codigo_original:i.codigo_original,descricao:i.descricao,marca:i.marca,unidade:i.unidade,quantidade:i.quantidade,preco_unitario:i.preco_unitario,total:i.total,
      escolhido:i.escolhido!==false,grupo_opcao:i.grupo_opcao,opcao_confirmada:!!i.opcao_confirmada,sob_encomenda:!!i.sob_encomenda}));
    const {error:e2}=await sb.from('orcamento_itens').insert(rows); if(e2) erro(e2);
  }
  if(CAPA.c.status==='Aberta'){await sb.from('capas').update({status:'Em orçamento'}).eq('id',CAPA.c.id);CAPA.c.status='Em orçamento';}
  await sb.from('atividades').insert({capa_id:CAPA.c.id,obra_id:CAPA.ob.id,usuario_id:EU.id,loja_id:CAPA.c.loja_id,tipo:'Orçamento enviado',
    resumo:`Orçamento ${reg.numero_santri||''} (${reg.momento}) — PDF ${brl(reg.valor_total_pdf)}, provável ${brl(reg.valor_provavel)}`});
  toast('Orçamento salvo'); abaOrc(); atualizarResumo(); return true;
}

    <td><select data-t="usuarios" data-f="loja_id" data-id="${u.id}"><option value=""></option>${LOJAS.map(l=>`<option value="${l.id}" ${l.id===u.loja_id?'selected':''}>${esc(l.codigo)}</option>`).join('')}</select></td>
    <td><select data-t="usuarios" data-f="papel" data-id="${u.id}" ${u.id===EU.id?'disabled':''}>${papeis.map(p=>`<option ${p===u.papel?'selected':''}>${p}</option>`).join('')}</select></td></tr>`).join('')}
  </table></div>`;
  ligarCampos($('#conteudo'));
}
</script>
</body>
</html>
