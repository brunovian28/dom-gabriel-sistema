    :listaJ('ent_ag',[['Pedido',x=>`<b>${esc(x.pedido)}</b> <span class="mut">${esc(lojaCodJ(x.loja))} · entrega ${esc(x.entrega)}</span>`,{csv:x=>x.pedido}],['Cliente',x=>esc(x.cliente)],['Telefone',x=>esc(x.telefone||'')],['Local',x=>esc(x.local||'')],['Gerada em',x=>dBR(x.cadastro)],['Dias',x=>`<span class="${x.dias>30?'atras':''}">${x.dias}</span>`,{r:1,csv:x=>x.dias}],['Separação',x=>esc(x.separacao||'')],['Valor',x=>brl0(x.valor),{r:1,csv:x=>nCsv(x.valor)}],['Peso (kg)',x=>nfJ(x.peso),{r:1}],['Pago',x=>x.pago_pct==null?'—':x.pago_pct+'%',{r:1}],['Cidade',x=>esc(x.cidade||'')],['Vendedor',x=>esc(x.vendedor||'')]],d.aguardando||[],{nota:'Entregas geradas no Santri com o manifesto "Aguardando carregamento". O Santri não guarda a data em que o cliente recebeu: a entrega só sai daqui quando o manifesto é baixado. Muitas podem já ter sido entregues sem baixa (sobretudo em Primavera).'});
  $('#conteudo').innerHTML=cabJ('Entregas'+lojaSufixo(),fonteJ(d.foto_em,'Entregas do Santri'))+
    (!d.foto_em?semDadosJ('entregas'):'')+
    `<div class="kpis" style="margin-bottom:12px">${kpiJ(nfJ(r.aguardando),'aguardando carregamento · '+brl0(r.aguardando_valor))}${kpiJ(nfJ(r.aguardando_30),'há mais de 30 dias · '+brl0(r.aguardando_30_valor),r.aguardando_30>0)}${kpiJ(Math.round(r.aguardando_mediana||0)+' dias','espera (mediana)')}
      ${kpiJ(r.pagas_aguardando,'pagas e aguardando entrega · '+brl0(r.pagas_aguardando_valor))}${kpiJ(r.pendentes,'pendentes · '+brl0(r.pendentes_valor))}${kpiJ(r.pendentes_vencidas,'pendentes com previsão vencida',r.pendentes_vencidas>0)}${kpiJ(r.sem_agendamento,'sem agendamento · '+brl0(r.sem_agendamento_valor))}${kpiJ(nfJ(r.concluidas),'entregas concluídas (Entrega total)')}</div>
     <div class="card"><h3>Há quanto tempo estão aguardando</h3><div class="tbl"><table>${ida.map(x=>`<tr><td style="width:150px">${esc(x.faixa)}</td><td style="text-align:right;width:70px">${nfJ(x.qtd)}</td><td style="text-align:right;width:130px">${brl0(x.valor)}</td><td><div style="height:10px;border-radius:5px;background:${x.faixa==='até 30 dias'?'var(--ok)':'var(--quente)'};width:${Math.round(100*(x.valor||0)/max)}%"></div></td></tr>`).join('')}</table></div></div>`+
    abasJ('ent',[['aguardando','Aguardando carregamento'],['pendentes','Pendentes e sem agendamento'],['locais','Por local']],telaEntregasJ)+corpo;
}

// ---------- ESTOQUE ----------
async function telaEstoqueJ(){
  if(!veCompras()) return telaLista();
  $('#conteudo').innerHTML=cabJ('Estoque')+'<p class="mut">Carregando…</p>';
  let d; try{ d=await rpcJ('tela_estoque',{p_loja:lojaJ()}); }catch(e){ return erroTelaJ('Estoque',e); }
  const r=d.resumo, ab=J.aba.est||'parados';
  const foto=(d.fotos||[]).map(f=>`${esc(lojaCodJ(f.loja))} ${dBR(f.data)}`).join(' · ');
  const corpo=ab==='marcas'?listaJ('est_marcas',[['Marca',x=>esc(x.marca)],['Produtos',x=>x.produtos,{r:1}],['Valor',x=>brl0(x.valor),{r:1,csv:x=>nCsv(x.valor)}],['Sem entrada em 2026',x=>brl0(x.parado),{r:1,csv:x=>nCsv(x.parado)}],['% parado',x=>pctJ(x.parado,x.valor),{r:1}]],d.por_marca||[])
    :ab==='locais'?`<div class="card"><h3>Por local</h3><div class="tbl"><table><tr><th>Loja</th><th>Local</th><th style="text-align:right">Produtos</th><th style="text-align:right">Valor</th></tr>${(d.por_local||[]).map(x=>`<tr><td>${esc(lojaCodJ(x.loja))}</td><td>${esc(x.local)}</td><td style="text-align:right">${x.produtos}</td><td style="text-align:right">${brl0(x.valor)}</td></tr>`).join('')}</table></div><p class="mut">Sem os produtos com custo errado. Depósitos 01/02/03 são fixos da loja; um deles já foi eliminado.</p></div>`
    :ab==='semcusto'?listaJ('est_semcusto',[['Produto',x=>`<b>${esc(x.codigo)}</b> <span class="mut">${esc(lojaCodJ(x.loja))}</span>`,{csv:x=>x.codigo}],['Nome',x=>esc(x.nome)],['Marca',x=>esc(x.marca||'')],['Quantidade',x=>nfJ(x.qtd)+' '+esc(x.unidade||''),{r:1,csv:x=>nCsv(x.qtd)}],['Onde',x=>esc(x.locais)],['Última entrada',x=>dBR(x.ultima_entrada)]],d.sem_custo_lista||[],{nota:'Produtos com saldo e sem custo da última entrada no Santri: ficam fora do valor do estoque.'})
    :listaJ('est_parados',[['Produto',x=>`<b>${esc(x.codigo)}</b> <span class="mut">${esc(lojaCodJ(x.loja))}</span>`,{csv:x=>x.codigo}],['Nome',x=>esc(x.nome)],['Marca',x=>esc(x.marca||'')],['Quantidade',x=>nfJ(x.qtd)+' '+esc(x.unidade||''),{r:1,csv:x=>nCsv(x.qtd)}],['Valor',x=>brl0(x.valor),{r:1,csv:x=>nCsv(x.valor)}],['Onde',x=>esc(x.locais)],['Última entrada',x=>x.ultima_entrada?dBR(x.ultima_entrada):'antes de 2026'],['Última venda',x=>dBR(x.ult_venda)||'—']],d.parados||[],{nota:'Produtos com saldo e sem nenhuma nota de entrada baixada em 2026 (os 300 de maior valor). Candidatos a liquidar, devolver ou conferir o saldo. O estoque do Santri também tem saldo negativo (não aparece aqui).'});
  $('#conteudo').innerHTML=cabJ('Estoque'+lojaSufixo(),`<span class="mut">Foto: ${foto||'—'}</span>`)+
    (!(d.fotos||[]).length?semDadosJ('estoque por local'):'')+
    ((d.suspeitos||[]).length?`<div class="erro"><b>Custo errado no Santri:</b> ${(d.suspeitos||[]).map(s=>`${esc(s.codigo)} ${esc(s.nome)} (${esc(lojaCodJ(s.loja_id))}) com custo ${brl(s.custo)} → ${brl0(s.valor)}`).join(' · ')}. Fica fora dos totais abaixo. Corrigir o custo da última entrada.</div>`:'')+
    `<div class="kpis" style="margin-bottom:12px">${kpiJ(brl0(r.valor),'em estoque (custo da última entrada)')}${kpiJ(nfJ(r.produtos),'produtos com saldo')}${kpiJ(brl0(r.sem_entrada_2026_valor),`sem entrada em 2026 (${r.sem_entrada_2026} produtos) · ${pctJ(r.sem_entrada_2026_valor,r.valor)}`,r.sem_entrada_2026_valor>0.3*r.valor)}${kpiJ(brl0(r.entrada_180),'última entrada há mais de 180 dias (2026)')}${kpiJ(r.sem_custo,'produtos sem custo',r.sem_custo>0)}</div>`+
    abasJ('est',[['parados','Parados (sem entrada em 2026)'],['marcas','Por marca'],['locais','Por local'],['semcusto','Sem custo']],telaEstoqueJ)+corpo;
}

// ---------- FINANCEIRO ----------
async function telaFinanceiroJ(){
  if(!veFinanceiroJ()) return telaLista();
  $('#conteudo').innerHTML=cabJ('Financeiro')+'<p class="mut">Carregando…</p>';
  const ano=J.ano||new Date(hojeLocalJ()+'T12:00:00').getFullYear();
  let d; try{ d=await rpcJ('tela_financeiro',{p_loja:lojaJ(),p_ano:ano}); }catch(e){ return erroTelaJ('Financeiro',e); }
  const ab=J.aba.fin||'dre', pc=d.pagar?.por_categoria||{}, rc=d.receber||{};
  const NP={fornecedores:'Fornecedores e fretes',impostos:'Impostos',emprestimos:'Empréstimos e consórcios',despesas:'Despesas',antecipado:'Antecipado à fábrica (Pre) — já pago',credito:'Créditos (transferências, devoluções) — não é dívida'};
  const NR={clientes:'Clientes',credito_fornecedor:'Crédito com fornecedor (antecipado)',grupo_emprestimos:'Empresas do grupo / empréstimos',venda_direta:'Comissão de venda direta',outros:'Outros'};
  const meses=[...new Set((d.dre||[]).flatMap(l=>Object.keys(l.meses||{}).map(Number)))].sort((a,b)=>a-b).filter(m=>(d.dre||[]).some(l=>l.chave==='A'&&Number(l.meses?.[m]||0)!==0));
  const DESTAQUE=['A','=receita liquida de vendas','=resultado bruto','=margem de contribuicao','=lucro operacional','=lucro liquido antes do ir/cssl','=resultado liquido'];
  const mostrarDet=J.aba.finDet||false;
  const dreRows=(d.dre||[]).filter(l=>mostrarDet||l.nivel!==2);
  const corpoDRE=`<div class="card"><div class="linha" style="justify-content:space-between"><h3 style="margin:0">DRE ${ano}${lojaSufixo()}</h3><div class="linha"><button class="sec" id="finAnoM">‹ ${ano-1}</button><button class="sec" id="finAnoP">${ano+1} ›</button><label style="margin:0;display:flex;gap:6px;align-items:center;color:var(--txt)"><input type="checkbox" id="finDet" style="width:auto" ${mostrarDet?'checked':''}> contas detalhadas</label></div></div>
    <div class="tbl" style="margin-top:8px"><table style="font-size:13px"><tr><th>Plano financeiro</th>${meses.map(m=>`<th style="text-align:right">${MESES_J[m-1].slice(0,3)}</th>`).join('')}<th style="text-align:right">Ano</th><th style="text-align:right">% receita</th></tr>
    ${dreRows.map(l=>{const dest=DESTAQUE.includes(l.chave), rec=(d.dre||[]).find(x=>x.chave==='A'); return `<tr style="${dest?'font-weight:bold;background:#f5f7fa':''}"><td style="padding-left:${l.nivel===2?24:l.nivel===1?10:4}px;white-space:nowrap">${esc(l.descricao)}</td>${meses.map(m=>{const v=Number(l.meses?.[m]||0); return `<td style="text-align:right;white-space:nowrap" class="${dest&&v<0?'atras':''}">${v?brl0(v):''}</td>`;}).join('')}<td style="text-align:right;white-space:nowrap">${brl0(l.total)}</td><td style="text-align:right">${rec&&rec.total?(100*l.total/rec.total).toFixed(1)+'%':''}</td></tr>`;}).join('')||`<tr><td class="mut">DRE de ${ano} não importada.</td></tr>`}</table></div>
    ${(d.meses_sem_icms||[]).length?`<div class="aviso">Meses com receita e sem ICMS sobre vendas: ${(d.meses_sem_icms||[]).map(x=>`${esc(lojaCodJ(x.loja))} ${MESES_J[x.mes-1]}`).join(', ')}. O imposto da DRE vem dos títulos lançados no financeiro; sem o lançamento, a margem do mês fica alta.</div>`:''}
    <p class="mut">DRE do Santri (competência, analítico), importada em ${d.dre_em?dataHoraJ(d.dre_em):'—'}. Com "Ver loja: Ambas", soma as duas lojas.</p></div>`;
  const corpo=ab==='pagar'?`<div class="card"><h3>Agenda de pagamentos (sem antecipados e créditos)</h3><div class="kpis">${(d.pagar?.agenda||[]).map(x=>kpiJ(brl0(x.valor),`${x.faixa} · ${x.qtd} títulos`,x.faixa.startsWith('vencido'))).join('')}</div></div>`
       +listaJ('fin_prox',[['Vencimento',x=>dBR(x.vencimento)],['Fornecedor / credor',x=>esc(x.nome)],['Documento',x=>esc(x.documento||'')],['Plano',x=>esc(x.plano||'')],['Loja',x=>esc(lojaCodJ(x.loja))],['Saldo',x=>brl0(x.saldo),{r:1,csv:x=>nCsv(x.saldo)}]],d.pagar?.proximos||[],{nota:'Próximos 15 dias.'})
       +listaJ('fin_venc',[['Vencimento',x=>dBR(x.vencimento)],['Dias',x=>`<span class="atras">${x.dias}</span>`,{r:1,csv:x=>x.dias}],['Fornecedor / credor',x=>esc(x.nome)],['Documento',x=>esc(x.documento||'')],['Plano',x=>esc(x.plano||'')],['Loja',x=>esc(lojaCodJ(x.loja))],['Saldo',x=>brl0(x.saldo),{r:1,csv:x=>nCsv(x.saldo)}]],d.pagar?.vencidos||[],{nota:'Vencidos e não baixados no Santri (os 150 maiores). Parte pode estar paga sem baixa.'})
    :ab==='antecipados'?listaJ('fin_ant',[['Fornecedor',x=>esc(x.fornecedor)],['Loja',x=>esc(lojaCodJ(x.loja))],['Títulos',x=>x.qtd,{r:1}],['Saldo',x=>brl0(x.saldo),{r:1,csv:x=>nCsv(x.saldo)}],['Mais antigo',x=>dBR(x.mais_antigo)],['Há mais de 90 dias',x=>`<span class="${x.mais_90>0?'atras':''}">${brl0(x.mais_90)}</span>`,{r:1,csv:x=>nCsv(x.mais_90)}]],d.antecipados||[],{nota:'Tipo "Pre" em contas a pagar: pagamento antecipado à fábrica (Dexco) que fica aberto até a nota chegar. Já saiu do caixa — não é dívida. Antecipado antigo = mercadoria que não veio ou título que não foi baixado com a nota.'})
       +listaJ('fin_credforn',[['Fornecedor',x=>esc(x.fornecedor)],['Loja',x=>esc(lojaCodJ(x.loja))],['Títulos',x=>x.qtd,{r:1}],['Saldo',x=>brl0(x.saldo),{r:1,csv:x=>nCsv(x.saldo)}],['Há mais de 90 dias',x=>brl0(x.mais_90),{r:1,csv:x=>nCsv(x.mais_90)}]],d.credito_fornecedor||[],{nota:'Créditos com fornecedor em contas a receber (pagamento "Crédito gerado" ainda não usado).'})
    :ab==='creditos'?`<div class="card"><h3>Créditos em contas a pagar (tipo Cre)</h3><div class="tbl"><table><tr><th>Origem</th><th>Loja</th><th style="text-align:right">Títulos</th><th style="text-align:right">Saldo</th></tr>${(d.creditos||[]).map(x=>`<tr><td>${esc(x.origem)}</td><td>${esc(lojaCodJ(x.loja))}</td><td style="text-align:right">${x.qtd}</td><td style="text-align:right">${brl0(x.saldo)}</td></tr>`).join('')}</table></div><p class="mut">Transferências entre lojas lançadas como crédito (TRANSF, com várias grafias), devoluções de cliente (DEV) e sobra de pedido (ORC). Precisa de um jeito único de lançar a transferência entre lojas.</p></div>`
       +listaJ('fin_semplano',[['Nome',x=>esc(x.nome)],['Documento',x=>esc(x.documento||'')],['Tipo',x=>esc(x.tipo)],['Loja',x=>esc(lojaCodJ(x.loja))],['Vencimento',x=>dBR(x.vencimento)],['Saldo',x=>brl0(x.saldo),{r:1,csv:x=>nCsv(x.saldo)}]],d.sem_plano||[],{nota:'Títulos a pagar em aberto "SEM PLANO": ficam fora da DRE e do fluxo por categoria.'})
    :corpoDRE;
  $('#conteudo').innerHTML=cabJ('Financeiro'+lojaSufixo(),fonteJ(d.foto_em,'Contas a pagar/receber'))+
    `<div class="g2"><div class="card"><h3>Contas a pagar em aberto</h3><div class="tbl"><table><tr><th>Categoria</th><th style="text-align:right">Títulos</th><th style="text-align:right">Saldo</th><th style="text-align:right">Vencido</th></tr>${Object.keys(NP).filter(k=>pc[k]).map(k=>`<tr><td>${NP[k]}</td><td style="text-align:right">${pc[k].qtd}</td><td style="text-align:right">${brl0(pc[k].saldo)}</td><td style="text-align:right" class="${pc[k].vencido>0&&!['antecipado','credito'].includes(k)?'atras':''}">${brl0(pc[k].vencido)}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">Contas a pagar não importadas.</td></tr>'}</table></div></div>
      <div class="card"><h3>Contas a receber em aberto</h3><div class="tbl"><table><tr><th>De quem</th><th style="text-align:right">Títulos</th><th style="text-align:right">Saldo</th><th style="text-align:right">Vencido</th></tr>${Object.keys(NR).filter(k=>rc[k]).map(k=>`<tr><td>${NR[k]}</td><td style="text-align:right">${rc[k].qtd}</td><td style="text-align:right">${brl0(rc[k].saldo)}</td><td style="text-align:right">${brl0(rc[k].vencido)}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">Contas a receber não importadas.</td></tr>'}</table></div><p class="mut"><a href="#/recebimentos">Ver recebimentos dos clientes →</a></p></div></div>`+
    abasJ('fin',[['dre','DRE'],['pagar','Agenda de pagamentos'],['antecipados','Antecipados à fábrica'],['creditos','Créditos e sem plano']],telaFinanceiroJ)+corpo;
  if($('#finAnoM')){ $('#finAnoM').onclick=()=>{J.ano=ano-1;telaFinanceiroJ();}; $('#finAnoP').onclick=()=>{J.ano=ano+1;telaFinanceiroJ();}; $('#finDet').onchange=e=>{J.aba.finDet=e.target.checked;telaFinanceiroJ();}; }
}

// situação do Santri (pago / entregue) na lista de pedidos
async function situacaoSantriPedidos(numeros){
  if(!numeros.length) return {};
  const {data,error}=await sb.rpc('situacao_santri_pedidos',{p_numeros:numeros}); if(error){ console.error(error); return {}; }
  return data||{};
}
function selosSantri(s){
  if(!s) return '<span class="mut">—</span>';
  const p=s.valor?Math.round(100*Math.min(s.pago,s.valor)/s.valor):null;
  const pg=p==null?'':p>=98?pillJ('pago','var(--ok)'):p>0?pillJ('pago '+p+'%','var(--morna)'):pillJ('sem pagamento','var(--quente)');
  const en=!s.entregas?'':s.entregues===s.entregas?pillJ('entregue','var(--ok)'):s.aguardando?pillJ('aguardando carregamento','var(--fria)'):pillJ(`${s.entregues}/${s.entregas} entregues`,'var(--morna)');
  return pg+' '+en;
}
