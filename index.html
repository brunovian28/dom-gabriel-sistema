<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<title>Dom Gabriel · Sistema</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#1F3A5F;--navy2:#2c4f7c;--gold:#C9A227;--bg:#F4F5F7;--card:#fff;--txt:#1d2733;--mut:#6b7684;--bd:#e2e6ea;
--quente:#c62828;--morna:#e08e0b;--fria:#1e6fb8;--ok:#2e7d32}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--navy);color:#fff}
button.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}button.link{background:none;color:var(--navy);padding:4px 6px}
button.gold{background:var(--gold);color:#1d2733}button.del{background:none;color:#b00;padding:4px 8px}
input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--txt)}
input:disabled,select:disabled,textarea:disabled{background:#f2f3f5;color:#555}
textarea{min-height:60px;resize:vertical}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.hide{display:none!important}.mut{color:var(--mut);font-size:13px}
/* layout */
#topo{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
#topo b{font-size:16px}#topo small{color:#cfd8e3}
#corpo{display:flex;min-height:calc(100% - 52px)}
#menu{width:220px;background:#fff;border-right:1px solid var(--bd);padding:12px 8px;flex-shrink:0}
#menu a{display:block;padding:10px 12px;border-radius:8px;color:var(--txt);text-decoration:none;margin-bottom:2px}
#menu a.on{background:#eef3f9;color:var(--navy);font-weight:bold}
#conteudo{flex:1;padding:16px;max-width:1200px;margin:0 auto;width:100%;padding-bottom:90px}
#menuMob{display:none}
@media (max-width:800px){#menu{display:none}#menuMob{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
#menuMob a{flex:1;text-align:center;padding:10px 4px;font-size:12px;color:var(--mut);text-decoration:none}#menuMob a.on{color:var(--navy);font-weight:bold}#conteudo{padding:12px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px;color:var(--navy)}
.linha{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
@media (max-width:800px){.g2,.g3{grid-template-columns:1fr}}
.pill{display:inline-block;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:bold;color:#fff}
.kpi .pill{color:#fff!important;font-size:13px}.Quente{background:var(--quente)}.Morna{background:var(--morna)}.Fria{background:var(--fria)}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.capaCard{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px;cursor:pointer}
.capaCard:hover{border-color:var(--navy2)}
.capaCard .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.atras{color:var(--quente);font-weight:bold}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--bd);margin:8px 0 12px;scrollbar-width:none}
.tabs a{padding:9px 12px;white-space:nowrap;color:var(--mut);text-decoration:none;border-bottom:3px solid transparent}
.tabs a.on{color:var(--navy);border-color:var(--gold);font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}th{color:var(--mut);font-weight:normal;font-size:12px}
.tbl{overflow-x:auto}
.item{border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:8px;background:#fff}
.sug{border:1px solid var(--bd);border-radius:8px;max-height:260px;overflow:auto;background:#fff}
.sug div{padding:8px 10px;border-bottom:1px solid var(--bd);cursor:pointer}.sug div:hover{background:#f5f7fa}
.kpis{display:flex;gap:10px;flex-wrap:wrap}.kpi{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:8px 12px}.kpi b{display:block;font-size:17px;color:var(--navy)}.kpi span{font-size:12px;color:var(--mut)}
#toast{position:fixed;right:16px;bottom:80px;background:#1d2733;color:#fff;padding:9px 14px;border-radius:8px;opacity:0;transition:.2s;z-index:50;font-size:14px}
#toast.on{opacity:.93}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;z-index:40;padding:40px 12px;overflow:auto}
.modal .card{max-width:520px;width:100%}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.chk input[type=checkbox]{width:22px;height:22px;flex-shrink:0}
.chk .txt{flex:1}.chk input[type=date]{width:150px}
#login{max-width:380px;margin:60px auto}
.aviso{background:#fff4e0;color:#8a5200;padding:8px 10px;border-radius:8px;font-size:13px;margin:6px 0}
.erro{background:#fdecea;color:#b00;padding:8px 10px;border-radius:8px;font-size:13px;margin:6px 0}
</style>
</head>
<body>
<div id="topo"><div><b>Dom Gabriel</b> <small>· Sistema interno</small></div><div id="quem" class="mut" style="color:#cfd8e3"></div></div>

<div id="login" class="card">
  <h3>Entrar</h3>
  <label>E-mail</label><input id="lEmail" type="email" autocomplete="username">
  <label>Senha</label><input id="lSenha" type="password" autocomplete="current-password">
  <div id="lNomeBox" class="hide"><label>Seu nome completo</label><input id="lNome"></div>
  <div class="linha" style="margin-top:12px"><button id="bEntrar">Entrar</button><button class="sec" id="bCriar">Criar meu acesso</button></div>
  <div id="lMsg"></div>
</div>

<div id="corpo" class="hide">
  <nav id="menu"></nav>
  <main id="conteudo"></main>
</div>
<nav id="menuMob" class="hide"></nav>
<div id="toast"></div>
<div id="modal"></div>

<script>
const sb = supabase.createClient('https://vmpxssoyqfdnnyhnvkyl.supabase.co','sb_publishable_NXQa66tcvLT7k_uib2UAeg_E0as2h7M');
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dBR = d => d ? new Date(d + (d.length===10?'T12:00:00':'')).toLocaleDateString('pt-BR') : '';
const hoje = () => new Date().toISOString().slice(0,10);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600);}
function erro(e){ console.error(e); toast('Erro: '+(e.message||e)); }
window.addEventListener('unhandledrejection',e=>erro(e.reason||e));

let EU=null, LOJAS=[], OP={}, CAPA=null;
const ehDirecao = () => ['admin','direcao'].includes(EU?.papel);

// ================= LOGIN =================
let modoCriar=false;
$('#bCriar').onclick=async()=>{
  if(!modoCriar){modoCriar=true;$('#lNomeBox').classList.remove('hide');$('#bCriar').textContent='Enviar cadastro';return;}
  const {error}=await sb.auth.signUp({email:$('#lEmail').value.trim(),password:$('#lSenha').value,options:{data:{nome:$('#lNome').value.trim()}}});
  $('#lMsg').innerHTML = error ? `<div class="erro">${esc(error.message)}</div>` : `<div class="aviso">Cadastro enviado. Confirme pelo e-mail e aguarde a direção liberar seu acesso.</div>`;
};
$('#bEntrar').onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$('#lEmail').value.trim(),password:$('#lSenha').value});
  if(error) return $('#lMsg').innerHTML=`<div class="erro">Não foi possível entrar: ${esc(error.message)}</div>`;
  iniciar();
};
$('#lSenha').addEventListener('keydown',e=>{if(e.key==='Enter')$('#bEntrar').click()});

async function iniciar(){
  const {data:{user}}=await sb.auth.getUser(); if(!user) return;
  const {data:eu}=await sb.from('usuarios').select('*').eq('id',user.id).maybeSingle();
  if(!eu||!eu.ativo){ $('#lMsg').innerHTML='<div class="aviso">Seu acesso ainda não foi liberado pela direção.</div>'; await sb.auth.signOut(); return; }
  EU=eu;
  const [{data:lj},{data:op}]=await Promise.all([sb.from('lojas').select('*').order('id'), sb.from('listas_opcoes').select('lista,valor,ordem').eq('ativo',true).order('ordem')]);
  LOJAS=lj||[]; OP={}; (op||[]).forEach(o=>(OP[o.lista]=OP[o.lista]||[]).push(o.valor));
  $('#login').classList.add('hide'); $('#corpo').classList.remove('hide'); $('#menuMob').classList.remove('hide');
  $('#quem').innerHTML=`${esc(eu.nome)} · ${esc(eu.papel)} <button class="link" style="color:#fff" id="sair">Sair</button>`;
  $('#sair').onclick=async()=>{await sb.auth.signOut();location.hash='';location.reload();};
  montarMenu(); rota();
}
sb.auth.getSession().then(({data})=>{ if(data.session) iniciar(); });

// ================= NAVEGAÇÃO =================
// quem enxerga as duas lojas escolhe qual ver (0 = ambas)
function veDuasLojas(){ return ehDirecao()||!!EU?.todas_lojas||!EU?.loja_id; }
let LOJA_VER=0;
function iniciarLojaVer(){ let v=0; try{ v=+(localStorage.getItem('lojaVer')||0); }catch(_){}
  LOJA_VER=veDuasLojas()?(LOJAS.some(l=>l.id===v)?v:0):(EU.loja_id||0);
  PDF_.loja=LOJA_VER; AG.loja=LOJA_VER; if(LOJA_VER) CST.loja=LOJA_VER;
  if(veDuasLojas()&&filtro.escopo==='minhas'&&!filtro._ini){ filtro.escopo='todas'; } filtro._ini=1; }
function montarMenu(){ iniciarLojaVer();
  const itens=SETORES.includes(EU.papel)?[['#/pedidos','Pedidos'],['#/agenda','Agenda'],['#/capas','Capas']]:[['#/capas','Capas'],['#/nova','+ Nova capa'],['#/painel','Painel'],['#/pedidos','Pedidos'],['#/agenda','Agenda'],['#/profissionais','Profissionais']]; if(ehDirecao()) itens.push(['#/usuarios','Usuários'],['#/parametros','Parâmetros'],['#/condicoes','Condições de pagamento'],['#/conferencia-st','Conferência de ST']);
  const seletor=veDuasLojas()?`<div style="padding:12px"><label style="color:#cfd8e3">Ver loja</label><select id="lojaVer" style="margin-top:4px"><option value="0">Ambas (PVA + RV)</option>${LOJAS.map(l=>`<option value="${l.id}">${esc(l.codigo)} – ${esc(l.nome)}</option>`).join('')}</select></div>`
    :`<p class="mut" style="padding:12px">Loja: ${esc(LOJAS.find(l=>l.id===EU.loja_id)?.codigo||'-')}</p>`;
  $('#menu').innerHTML=itens.map(([h,t])=>`<a href="${h}">${t}</a>`).join('')+seletor;
  if($('#lojaVer')){ $('#lojaVer').value=String(LOJA_VER); $('#lojaVer').onchange=e=>{ LOJA_VER=+e.target.value; try{localStorage.setItem('lojaVer',LOJA_VER)}catch(_){}
    PDF_.loja=LOJA_VER; AG.loja=LOJA_VER; if(LOJA_VER) CST.loja=LOJA_VER; PNL.editar=false; rota(); }; }
  $('#menuMob').innerHTML=itens.map(([h,t])=>`<a href="${h}">${t}</a>`).join('');
}
window.addEventListener('hashchange',rota);
function rota(){
  if(!EU) return; const h=location.hash||'#/capas';
  document.querySelectorAll('#menu a,#menuMob a').forEach(a=>a.classList.toggle('on',h.startsWith(a.getAttribute('href'))));
  if(h.startsWith('#/capa/')) return abrirCapa(h.split('/')[2]);
  if(h==='#/nova') return novaCapa();
  if(h==='#/usuarios') return telaUsuarios();
  if(h==='#/parametros') return telaParametros();
  if(h==='#/conferencia-st') return telaConfST();
  if(h==='#/profissionais') return telaProfissionais();
  if(h==='#/condicoes') return telaCondicoes();
  if(h==='#/pedidos') return telaPedidos();
  if(h==='#/agenda') return telaAgenda();
  if(h==='#/painel') return telaPainel();
  telaLista();
}
const sel=(lista,val,attrs='')=>`<select ${attrs}><option value=""></option>${(OP[lista]||[]).map(v=>`<option ${v===val?'selected':''}>${esc(v)}</option>`).join('')}</select>`;

// ================= LISTA DE CAPAS =================
let filtro={escopo:'minhas',status:'abertas',busca:''};
async function telaLista(){
  $('#conteudo').innerHTML=`
  <div class="linha" style="justify-content:space-between"><h2 style="margin:4px 0;color:var(--navy)">Capas de atendimento</h2><button class="gold" onclick="location.hash='#/nova'">+ Nova capa</button></div>
  <div class="card"><div class="g3">
    <div><label>Buscar (nome, WhatsApp, endereço, nº)</label><input id="fBusca" value="${esc(filtro.busca)}" placeholder="ex.: Juliana, 66999…, Rua…"></div>
    <div><label>Mostrar</label><select id="fEscopo"><option value="minhas">Minhas capas</option>${veDuasLojas()?'':'<option value="loja">Todas da loja</option>'}${veDuasLojas()?'<option value="todas">Todas as capas (loja escolhida no menu)</option>':''}</select></div>
    <div><label>Status</label><select id="fStatus"><option value="abertas">Em andamento</option><option value="todas">Todos</option>${(OP.status_capa||[]).map(s=>`<option>${esc(s)}</option>`).join('')}</select></div>
  </div></div>
  <div id="kpis" class="kpis" style="margin-bottom:12px"></div>
  <div id="res" class="lista"><p class="mut">Carregando…</p></div>`;
  $('#fEscopo').value=filtro.escopo; $('#fStatus').value=filtro.status;
  let t; $('#fBusca').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{filtro.busca=e.target.value;carregarLista()},300)};
  $('#fEscopo').onchange=e=>{filtro.escopo=e.target.value;carregarLista()};
  $('#fStatus').onchange=e=>{filtro.status=e.target.value;carregarLista()};
  carregarLista();
}
async function carregarLista(){
  let q=sb.from('vw_capas_lista').select('*').order('proximo_passo_data',{ascending:true,nullsFirst:false}).limit(300);
  if(filtro.escopo==='minhas') q=q.eq('vendedor_id',EU.id);
  else if(filtro.escopo==='loja'||filtro.escopo==='todas'){ const lj=filtro.escopo==='loja'?(LOJA_VER||EU.loja_id):LOJA_VER; if(lj) q=q.eq('loja_id',lj); }
  else if(/^l\d+$/.test(filtro.escopo)) q=q.eq('loja_id',+filtro.escopo.slice(1));
  if(filtro.status==='abertas') q=q.in('status',['Aberta','Em orçamento']);
  else if(filtro.status!=='todas') q=q.eq('status',filtro.status);
  const b=filtro.busca.trim().toLowerCase(); if(b) q=q.ilike('busca','%'+b.replace(/[%_]/g,'')+'%');
  const {data,error}=await q; if(error) return erro(error);
  const tot=data.reduce((s,c)=>s+Number(c.valor_em_negociacao||0),0), atras=data.filter(c=>c.proximo_passo_atrasado).length;
  const cnt=t=>data.filter(c=>c.temperatura===t).length;
  $('#kpis').innerHTML=`<div class="kpi"><b>${data.length}</b><span>capas</span></div><div class="kpi"><b>${brl(tot)}</b><span>em negociação (quentes)</span></div>
    <div class="kpi"><b><span class="pill Quente">${cnt('Quente')}</span> <span class="pill Morna">${cnt('Morna')}</span> <span class="pill Fria">${cnt('Fria')}</span></b><span>quentes · mornas · frias</span></div>
    <div class="kpi"><b class="${atras?'atras':''}">${atras}</b><span>próximo passo atrasado</span></div>`;
  $('#res').innerHTML = data.length ? data.map(c=>`
    <div class="capaCard" onclick="location.hash='#/capa/${c.id}'">
      <div class="t"><b>${esc(c.pessoas_nomes||'(sem cliente vinculado)')}</b><span class="pill ${c.temperatura}">${c.temperatura}</span></div>
      <div class="mut">${esc(c.numero)} · ${esc(c.status)} · ${esc(c.vendedor_nome||'')}</div>
      <div class="mut">${esc([c.endereco,c.bairro].filter(Boolean).join(' – ')||'obra sem endereço')}${c.etapa?' · '+esc(c.etapa):''}</div>
      <div style="margin-top:6px">${c.valor_em_negociacao>0?`<b>${brl(c.valor_em_negociacao)}</b> em negociação · `:''}
        <span class="${c.proximo_passo_atrasado?'atras':''}">${c.proximo_passo?`Próximo: ${esc(c.proximo_passo)}${c.proximo_passo_data?' ('+dBR(c.proximo_passo_data)+')':''}`:'<span class="atras">sem próximo passo</span>'}</span></div>
    </div>`).join('') : '<p class="mut">Nenhuma capa encontrada.</p>';
}

// ================= NOVA CAPA =================
function novaCapa(){
  $('#conteudo').innerHTML=`<div class="card" style="max-width:560px">
    <h3>Nova Capa de Atendimento</h3>
    <label>Loja</label><select id="nLoja" ${ehDirecao()?'':'disabled'}>${LOJAS.map(l=>`<option value="${l.id}" ${l.id===(LOJA_VER||EU.loja_id)?'selected':''}>${esc(l.codigo)} – ${esc(l.nome)}</option>`).join('')}</select>
    <label>Tipo de entrada</label>${sel('tipo_entrada','','id="nTipo"')}
    <label>Origem do cliente</label>${sel('origem','','id="nOrigem"')}
    <label>Detalhe da origem (quem indicou, qual arquiteto…)</label><input id="nDet">
    <label>Endereço da obra (se já souber)</label><input id="nEnd">
    <div class="linha" style="margin-top:14px"><button class="gold" id="nCriar">Criar capa</button><button class="sec" onclick="history.back()">Cancelar</button></div>
    <div id="nMsg"></div></div>`;
  $('#nCriar').onclick=async()=>{
    if(!$('#nTipo').value||!$('#nOrigem').value) return $('#nMsg').innerHTML='<div class="erro">Informe o tipo de entrada e a origem.</div>';
    const loja=+$('#nLoja').value;
    const {data:ob,error:e1}=await sb.from('obras').insert({loja_id:loja,endereco:$('#nEnd').value||null,criado_por:EU.id}).select().single(); if(e1) return erro(e1);
    const {data:c,error:e2}=await sb.from('capas').insert({loja_id:loja,obra_id:ob.id,vendedor_id:EU.id,tipo_entrada:$('#nTipo').value,origem:$('#nOrigem').value,origem_detalhe:$('#nDet').value||null}).select().single(); if(e2) return erro(e2);
    await sb.from('atividades').insert({capa_id:c.id,obra_id:ob.id,usuario_id:EU.id,loja_id:loja,tipo:$('#nTipo').value==='Prospecção ativa'?'Mapeamento de obra':'Visita do cliente à loja',resumo:'Abertura da capa'});
    toast('Capa '+c.numero+' criada'); location.hash='#/capa/'+c.id;
  };
}

// ================= CAPA =================
let abaAtual='quem';
async function abrirCapa(id){
  $('#conteudo').innerHTML='<p class="mut">Carregando capa…</p>';
  const {data:c,error}=await sb.from('capas').select('*').eq('id',id).single(); if(error) return erro(error);
  const {data:ob}=c.obra_id?await sb.from('obras').select('*').eq('id',c.obra_id).single():{data:null};
  CAPA={c,ob,podeEditar: ehDirecao() || c.vendedor_id===EU.id || (EU.papel==='gerente'&&c.loja_id===EU.loja_id)};
  const vend=c.vendedor_id?(await sb.from('usuarios').select('nome').eq('id',c.vendedor_id).maybeSingle()).data:null;
  const dis=CAPA.podeEditar?'':'disabled';
  $('#conteudo').innerHTML=`
   <div class="linha" style="justify-content:space-between"><button class="link" onclick="location.hash='#/capas'">← Capas</button><span class="mut">${CAPA.podeEditar?'':'Somente leitura (capa de outro vendedor) — você pode registrar produtos vistos e contatos.'}</span></div>
   <div class="card">
     <div class="linha" style="justify-content:space-between"><div><b style="font-size:18px">${esc(c.numero)}<span id="capaCli"></span></b> <span class="mut">· aberta em ${dBR(c.data_abertura)} · ${esc(vend?.nome||'')}</span></div><div id="resumo"></div></div>
     <div class="g3">
       <div><label>Status</label>${sel('status_capa',c.status,`data-t="capas" data-f="status" ${dis}`)}</div>
       <div><label>Próximo passo (obrigatório)</label><input data-t="capas" data-f="proximo_passo" value="${esc(c.proximo_passo)}" ${dis}></div>
       <div><label>Data do próximo passo</label><input type="date" data-t="capas" data-f="proximo_passo_data" value="${c.proximo_passo_data||''}" ${dis}></div>
     </div>
     <div id="perdaBox" class="${c.status==='Perdida'?'':'hide'}"><label>Motivo da perda</label>${sel('motivo_perda',c.motivo_perda,`data-t="capas" data-f="motivo_perda" ${dis}`)}</div>
   </div>

async function buscarPessoa(txt){
  const box=$('#pSug'); txt=txt.trim(); if(txt.length<2){box.classList.add('hide');return;}

  q = dig.length>=4 ? q.or(`whatsapp.ilike.*${dig}*,telefone.ilike.*${dig}*,codigo_santri.eq.${dig},nome.ilike.*${t}*`) : q.ilike('nome','%'+t+'%');
  const {data}=await q;
  box.classList.remove('hide');
  box.innerHTML=(data||[]).map(p=>`<div data-p="${p.id}"><b>${esc(p.nome)}</b> <span class="mut">${esc(p.whatsapp||'')}${p.codigo_santri?' · cód. '+esc(p.codigo_santri):''}${p.profissional?' · '+esc(p.profissao||'profissional'):''}</span></div>`).join('')+
    `<div data-novo="1" style="color:var(--navy)"><b>+ Novo cadastro:</b> ${esc(txt)}</div>`;
  box.querySelectorAll('[data-p]').forEach(d=>d.onclick=()=>{box.classList.add('hide'); formCliente({id:d.dataset.p,vincular:true});});
  box.querySelector('[data-novo]').onclick=()=>{box.classList.add('hide'); formCliente({nome:txt,vincular:true});};
}

// código de cliente do Santri vindo do orçamento/pedido: completa o cadastro do titular (ou cria o titular)
async function vincularClienteSantri(cab){
  const cod=cab?.cliente_codigo; if(!cod) return;
  const nomePdf=(cab.cliente||'').replace(/^[\d.]+\s*-\s*/,'').trim();
  const {data:vs}=await sb.from('obra_pessoas').select('papel,pessoa:pessoas(id,nome,codigo_santri)').eq('obra_id',CAPA.ob.id);
  const cli=(vs||[]).filter(v=>!PAPEL_TIPO[v.papel]);
  if(cli.some(v=>v.pessoa.codigo_santri===cod)) return;
  const alvo=cli.find(v=>v.papel==='Titular da nota'&&!v.pessoa.codigo_santri)||(cli.length===1&&!cli[0].pessoa.codigo_santri?cli[0]:null);
  if(alvo){ await sb.from('pessoas').update({codigo_santri:cod}).eq('id',alvo.pessoa.id); return; }
  if(!cli.length&&nomePdf){
    let {data:ex}=await sb.from('pessoas').select('id').eq('codigo_santri',cod).limit(1);
    let pid=ex?.[0]?.id;
    if(!pid){ const {data:n}=await sb.from('pessoas').insert({nome:nomePdf,codigo_santri:cod,criado_por:EU.id,loja_id:CAPA.c.loja_id}).select().single(); pid=n?.id; }
    if(pid) await sb.from('obra_pessoas').insert({obra_id:CAPA.ob.id,pessoa_id:pid,papel:'Titular da nota',decide:true});
  }
}

const PDFJS_V='3.11.174';
let _pdfjs=null;
async function carregarPdfjs(){
  if(_pdfjs) return _pdfjs;
  await new Promise((ok,falha)=>{const s=document.createElement('script');s.src=`https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_V}/build/pdf.min.js`;s.onload=ok;s.onerror=()=>falha(new Error('Não consegui carregar o leitor de PDF'));document.head.appendChild(s);});
  _pdfjs=window.pdfjsLib; _pdfjs.GlobalWorkerOptions.workerSrc=`https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_V}/build/pdf.worker.min.js`;
  return _pdfjs;
}
// ===== Leitor de orçamento Santri (usa pdf.js). Funciona no navegador e no node =====
async function lerOrcamentoPDF(pdfjsLib, data){
  const doc = await pdfjsLib.getDocument({data}).promise;
  const linhas=[];
  for(let p=1;p<=doc.numPages;p++){
    const pg=await doc.getPage(p); const tc=await pg.getTextContent();
    const its=tc.items.filter(i=>i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4],y:Math.round(i.transform[5]),w:i.width}));
    const porY={}; its.forEach(i=>{const k=Object.keys(porY).find(y=>Math.abs(y-i.y)<=2); (porY[k??i.y]=porY[k??i.y]||[]).push(i);});
    Object.keys(porY).map(Number).sort((a,b)=>b-a).forEach(y=>linhas.push({pag:p,y,its:porY[y].sort((a,b)=>a.x-b.x)}));
  }
  const txt=l=>l.its.map(i=>i.s).join(' ');
  const num=s=>{s=String(s||'').trim();if(!s)return null;return Number(s.replace(/\./g,'').replace(',','.'))};
  const todo=linhas.map(txt).join('\n');
  const pega=(re)=>{const m=todo.match(re);return m?m[1].trim():null};
  const dt=s=>{const m=String(s||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?`${m[3]}-${m[2]}-${m[1]}`:null};
  const cab={
    numero: pega(/Orçamento:\s*([\d.]+)/), data_emissao: dt(pega(/Data emissão:\s*([\d\/]+)/)), data_validade: dt(pega(/Data de validade:\s*([\d\/]+)/)),
    vendedor: pega(/Vendedor:\s*(.+?)(?:\s+Fone|\n|$)/), condicao_pagamento: pega(/Condição de pagamento:\s*(.+)/),
    cliente: pega(/Cliente:\s*(.+?)(?:\s+A\/C:|\n|$)/), loja: pega(/DOM GABRIEL[^\n]*?-\s*(PVA|RV)/),
    eh_pedido: /Data de fechamento:/.test(todo), data_fechamento: dt(pega(/Data de fechamento:\s*([\d\/]+)/)), observacao: pega(/Observação:\s*(.+)/)
  };
  cab.cliente_codigo=(cab.cliente||'').match(/^([\d.]+)\s*-/)?.[1]?.replace(/\./g,'')||null;
  // quadro TOTAIS (pedido): Total produtos | Serviços adicionais | Valor desconto | Total pedido
  const totais={}; { const L=linhas.map(txt); const ih=L.findIndex(x=>/Total produtos/.test(x)&&/Serviços adicionais/.test(x));
    if(ih>=0){ const labs=['Total produtos','Serviços adicionais','Valor desconto','Total pedido'].filter(k=>L[ih].includes(k));
      const vals=(L[ih+1]||'').match(/[\d.]+,\d{2}/g)||[]; labs.forEach((k,j)=>{ if(vals[j]!=null) totais[k]=num(vals[j]); }); } }
  // colunas pelo cabeçalho da tabela
  const hl=linhas.find(l=>/Cod\. original/.test(txt(l)) && /Total/.test(txt(l)));
  if(!hl) throw new Error('Não encontrei a tabela de produtos neste PDF. É um orçamento do Santri?');
  const col={}; hl.its.forEach(i=>{const k=i.s.toLowerCase();
    if(k.startsWith('cod'))col.cod=i.x; else if(k==='produto')col.prod=i.x; else if(k.startsWith('descri'))col.desc=i.x; else if(k==='marca')col.marca=i.x;
    else if(k==='und')col.und=i.x; else if(k.startsWith('qtd'))col.qtd=i.x+i.w; else if(k.startsWith('preco'))col.preco=i.x+i.w; else if(k==='total')col.total=i.x+i.w;});
  const itens=[]; let amb=null; let ordem=0;
  const hdrIdx=linhas.indexOf(hl);
  for(const l of linhas.slice(hdrIdx+1)){
    const t=txt(l);
    if(/^TOTAIS/.test(t)||/Total produtos\s*$/.test(t)) break;
    if(/Cod\. original|Emitido em|ADM \d|Página:/.test(t)) continue;
    if(/Total produtos:/.test(t)) continue;
    // linha de item: tem número no fim (total) alinhado à coluna Total
    const ult=l.its[l.its.length-1];
    const temTotal = /^[\d.]+,\d{2}$/.test(ult.s) && Math.abs((ult.x+ult.w)-col.total)<40;
    if(temTotal && l.its.length>=6){
      const r=l.its; const nums=r.filter(i=>/^[\d.]+,\d+$/.test(i.s));
      const total=num(nums[nums.length-1].s), preco=num(nums[nums.length-2].s), qtd=num(nums[nums.length-3].s);
      const und=r.find(i=>Math.abs(i.x-col.und)<25 && /^[A-ZÇ]{1,4}\d?$/.test(i.s));
      const marca=r.filter(i=>i.x>=col.marca-5 && i.x<col.und-5).map(i=>i.s).join(' ');
      const desc=r.filter(i=>i.x>=col.desc-5 && i.x<col.marca-5).map(i=>i.s).join(' ');
      const pre=r.filter(i=>i.x<col.desc-5).map(i=>i.s).filter(s=>s!=='(*)');
      const codProd=pre.length?pre[pre.length-1]:null, codOrig=pre.length>1?pre[0].replace(/^\(\*\)\s*/,''):null;
      itens.push({ordem:++ordem,ambiente:amb,sob_encomenda:r.some(i=>i.s.startsWith('(*)')),codigo_original:codOrig,produto_id:codProd&&/^[\d.]+$/.test(codProd)?Number(codProd.replace(/\./g,'')):null,
        descricao:desc,marca,unidade:und?und.s:null,quantidade:qtd,preco_unitario:preco,total});
    } else if(!/\d{2}\/\d{2}\/\d{4}/.test(t) && l.its.every(i=>i.x>=col.prod-10 && i.x<col.marca+60)) {
      amb=t.trim();
    }
  }
  const tg=todo.match(/TOTAL GERAL[\s\S]*?([\d.]+,\d{2})\s*$/m); 
  const totalLinhas=linhas.map(txt); let totalGeral=null;
  const iTG=totalLinhas.findIndex(s=>/TOTAL GERAL/.test(s)); if(iTG>=0){ for(let k=iTG;k<Math.min(iTG+3,totalLinhas.length);k++){ const m=totalLinhas[k].match(/([\d.]+,\d{2})\s*$/); if(m){totalGeral=num(m[1]);} } }
  return {cabecalho:cab,itens,totais,total_geral:totalGeral ?? itens.reduce((s,i)=>s+i.total,0)};
}
// sugere grupos de opções: mesmo ambiente + mesma unidade + mesma quantidade
function sugerirOpcoes(itens){
  const grupos={}; let g=0;
  const chave=i=>`${i.ambiente}|${i.unidade}|${(i.quantidade||0).toFixed(3)}`;
  const cont={}; itens.forEach(i=>cont[chave(i)]=(cont[chave(i)]||0)+1);
  itens.forEach(i=>{ const k=chave(i); if(cont[k]>1){ if(!grupos[k]) grupos[k]=++g; i.grupo_opcao=grupos[k];
     i.opcao_confirmada=/OP[ÇC]/i.test(i.ambiente||''); } else { i.grupo_opcao=null; i.opcao_confirmada=false; } });
  // escolhido padrão: em cada grupo, o mais barato
  Object.values(grupos).forEach(gid=>{ const gs=itens.filter(i=>i.grupo_opcao===gid); const m=gs.reduce((a,b)=>b.total<a.total?b:a); gs.forEach(i=>i.escolhido=(i===m)); });
  itens.forEach(i=>{ if(i.grupo_opcao==null) i.escolhido=true; });
  return itens;
}
// valor provável: itens sem grupo + escolhido de cada grupo confirmado; grupo não confirmado conta tudo
function valorProvavel(itens){
  return itens.reduce((s,i)=> s + ( i.grupo_opcao==null ? i.total : (i.opcao_confirmada ? (i.escolhido?i.total:0) : i.total) ), 0);
}

function blocoItens(itens, prefixo){

  const ambs=[...new Set(itens.map(i=>i.ambiente||'(sem ambiente)'))];

        return `<div class="item" style="border-color:${conf?'var(--gold)':'#aab4c0'};background:${conf?'#fffaf0':'#f7f9fc'}">

function ligarBlocoItens(root, itens, rerender){
  root.querySelectorAll('[data-esc]').forEach(r=>r.onchange=()=>{const it=itens.find(i=>i.ordem==r.dataset.esc);itens.filter(i=>i.grupo_opcao===it.grupo_opcao).forEach(i=>i.escolhido=(i===it));rerender();});
  root.querySelectorAll('[data-sair]').forEach(b=>b.onclick=e=>{e.preventDefault();const it=itens.find(i=>i.ordem==b.dataset.sair);const g=it.grupo_opcao;
    it.grupo_opcao=null;it.opcao_confirmada=false;it.escolhido=true;const R=itens.filter(i=>i.grupo_opcao===g);
    if(R.length<2) R.forEach(i=>{i.grupo_opcao=null;i.opcao_confirmada=false;i.escolhido=true;}); else if(!R.some(i=>i.escolhido)){const m=R.reduce((a,c)=>c.total<a.total?c:a);m.escolhido=true;}
    rerender();});
  root.querySelectorAll('[data-conf]').forEach(b=>b.onclick=()=>{const g=+b.dataset.conf;const G=itens.filter(i=>i.grupo_opcao===g);
    if(b.dataset.v==='1'){G.forEach(i=>i.opcao_confirmada=true);} else {G.forEach(i=>{i.opcao_confirmada=false;i.grupo_opcao=null;i.escolhido=true;});}
    rerender();});
}

async function salvarOrcamento(reg, itens, existentes){
  const cabS=reg._cab; delete reg._cab; reg.capa_id=CAPA.c.id; reg.criado_por=EU.id;
  if(existentes&&existentes.length){ await sb.from('orcamentos').update({status:'Substituído (nova versão)',quente:false}).in('id',existentes.map(e=>e.id)); }
  const {data:o,error}=await sb.from('orcamentos').insert(reg).select().single();
  if(error){ erro(error.code==='23505'?{message:'Já existe um orçamento quente neste momento. Salve como "não quente" ou desmarque o outro.'}:error); return false; }
  if(itens&&itens.length){
    const ids=[...new Set(itens.map(i=>i.produto_id).filter(Boolean))];
    const {data:exist}=ids.length?await sb.from('produtos').select('id').in('id',ids):{data:[]};
    const ok=new Set((exist||[]).map(x=>x.id));
    const rows=itens.map(i=>({orcamento_id:o.id,ordem:i.ordem,ambiente:i.ambiente,ambiente_com_opcoes:/OP[ÇC]/i.test(i.ambiente||''),produto_id:ok.has(i.produto_id)?i.produto_id:null,
      codigo_original:i.codigo_original,descricao:i.descricao,marca:i.marca,unidade:i.unidade,quantidade:i.quantidade,preco_unitario:i.preco_unitario,total:i.total,
      escolhido:i.escolhido!==false,grupo_opcao:i.grupo_opcao,opcao_confirmada:!!i.opcao_confirmada,sob_encomenda:!!i.sob_encomenda}));
    const {error:e2}=await sb.from('orcamento_itens').insert(rows); if(e2) erro(e2);
  }
  if(CAPA.c.status==='Aberta'){await sb.from('capas').update({status:'Em orçamento'}).eq('id',CAPA.c.id);CAPA.c.status='Em orçamento';}
  if(cabS){ await vincularClienteSantri(cabS); atualizarNomeCapa(); }
  await sb.from('atividades').insert({capa_id:CAPA.c.id,obra_id:CAPA.ob.id,usuario_id:EU.id,loja_id:CAPA.c.loja_id,tipo:'Orçamento enviado',
    resumo:`Orçamento ${reg.numero_santri||''} (${reg.momento}) — PDF ${brl(reg.valor_total_pdf)}, provável ${brl(reg.valor_provavel)}`});
  toast('Orçamento salvo'); abaOrc(); atualizarResumo(); return true;
}

let AG={mes:null,loja:0};
async function telaAgenda(){
  const hj=new Date(hoje()+'T12:00:00'); if(!AG.mes) AG.mes=new Date(hj.getFullYear(),hj.getMonth(),1);
  const ini=new Date(AG.mes), fim=new Date(ini.getFullYear(),ini.getMonth()+1,0); const iso=d=>d.toISOString().slice(0,10);
  let q=sb.from('pedidos').select('id,capa_id,loja_id,numero_santri,cliente_pdf,previsao_entrega,data_cliente_precisa,guarda_ate,local_mercadoria,total_pedido').neq('status','Cancelado')
     .or(`and(previsao_entrega.gte.${iso(ini)},previsao_entrega.lte.${iso(fim)}),and(data_cliente_precisa.gte.${iso(ini)},data_cliente_precisa.lte.${iso(fim)}),and(guarda_ate.gte.${iso(ini)},guarda_ate.lte.${iso(fim)})`);

  const ev={}; const add=(d,e)=>{if(!d)return;(ev[d]=ev[d]||[]).push(e);};
  data.forEach(p=>{const cli=esc((p.cliente_pdf||'').replace(/^[\d.]+\s*-\s*/,'').split(' ').slice(0,2).join(' '));

      add(p.guarda_ate,`<div class="ev gua" data-capa="${p.capa_id}">📦 guarda ${esc(p.numero_santri)} ${cli}</div>`);}});
  const nomeMes=ini.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const cel=[]; for(let i=0;i<ini.getDay();i++) cel.push('<div class="dia vazio"></div>');
  for(let d=1; d<=fim.getDate(); d++){ const k=iso(new Date(ini.getFullYear(),ini.getMonth(),d)); cel.push(`<div class="dia ${k===hoje()?'hoje':''}"><div class="n">${d}</div>${(ev[k]||[]).join('')}</div>`); }
  $('#conteudo').innerHTML=`<style>.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .cab{font-size:12px;color:var(--mut);text-align:center}.dia{background:#fff;border:1px solid var(--bd);border-radius:6px;min-height:86px;padding:4px;font-size:11px}

    .ev.ent{background:#e3f0ff}.ev.lim{background:#fff1d6}.ev.gua{background:#fde2e2}@media(max-width:700px){.dia{min-height:60px;font-size:10px}}</style>
   <div class="linha" style="justify-content:space-between"><h2 style="margin:4px 0;color:var(--navy)">Agenda de entregas</h2>
     <div class="linha" style="gap:6px"><select id="agLoja" style="width:auto"><option value="0">Todas as lojas</option>${LOJAS.map(l=>`<option value="${l.id}">${esc(l.codigo)}</option>`).join('')}</select>
     <button class="sec" id="agAnt">‹</button><b style="min-width:150px;text-align:center;text-transform:capitalize">${nomeMes}</b><button class="sec" id="agProx">›</button></div></div>
   <p class="mut">🚚 previsão de entrega · ⏰ data-limite do cliente · 📦 fim da guarda sem custo. Clique para abrir a capa.</p>
   <div class="cal">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="cab">${d}</div>`).join('')}${cel.join('')}</div>`;
  $('#agLoja').value=AG.loja; $('#agLoja').onchange=e=>{AG.loja=+e.target.value;telaAgenda();};
  $('#agAnt').onclick=()=>{AG.mes=new Date(ini.getFullYear(),ini.getMonth()-1,1);telaAgenda();}; $('#agProx').onclick=()=>{AG.mes=new Date(ini.getFullYear(),ini.getMonth()+1,1);telaAgenda();};

async function vincularProf(tipo,p){
  const {error}=await sb.from('obra_pessoas').insert({obra_id:CAPA.ob.id,pessoa_id:p.id,papel:PROF[tipo].papel,decide:false});
  if(error&&!/duplicate/i.test(error.message)) return erro(error);
  // arquiteta de escritório: se a obra ainda não tem escritório, já vincula
  if(tipo==='arq'&&p.escritorio_id&&!CAPA.ob.escritorio_id){ await sb.from('obras').update({escritorio_id:p.escritorio_id}).eq('id',CAPA.ob.id); CAPA.ob.escritorio_id=p.escritorio_id; }
  toast('Vinculado à obra');
}
async function sugProf(tipo,txt,box,onPick,opts={}){
  txt=(txt||'').trim(); if(txt.length<2){box.classList.add('hide');return;}
  const t=txt.replace(/[%,()]/g,''), dig=txt.replace(/\D/g,'');
  let data;
  if(tipo==='escr'){ ({data}=await sb.from('escritorios').select('id,nome,cidade').ilike('nome','%'+t+'%').eq('ativo',true).order('nome').limit(8)); }
  else { let q=sb.from('pessoas').select('id,nome,whatsapp,profissao,escritorio_id,escritorio:escritorios(nome)').eq('profissional',true).in('profissao',PROF[tipo].profs).order('nome').limit(8);
    q=dig.length>=4?q.or(`whatsapp.ilike.*${dig}*,nome.ilike.*${t}*`):q.ilike('nome','%'+t+'%'); ({data}=await q); }
  box.classList.remove('hide');
  box.innerHTML=(data||[]).map((p,i)=>`<div data-i="${i}"><b>${esc(p.nome)}</b> <span class="mut">${esc(p.profissao||p.cidade||'')}${p.escritorio?' · '+esc(p.escritorio.nome):''}${p.whatsapp?' · '+esc(p.whatsapp):''}</span></div>`).join('')
    +`<div data-novo="1" style="color:var(--navy)"><b>+ Novo cadastro:</b> ${esc(txt)}</div>`;
  box.querySelectorAll('[data-i]').forEach(d=>d.onclick=()=>{box.classList.add('hide');onPick(data[+d.dataset.i]);});
  box.querySelector('[data-novo]').onclick=async()=>{box.classList.add('hide');
    if(opts.criarDireto){ const {data:n,error}=await sb.from('escritorios').insert({nome:txt,criado_por:EU.id,loja_id:EU.loja_id}).select().single(); if(error) return toast(/unique|duplicate/i.test(error.message)?'Já existe um escritório com esse nome':'Erro: '+error.message); return onPick(n); }
    tipo==='escr'?formEscr({nome:txt},onPick):formProf({nome:txt,tipo},onPick);};
}

let PNL={mes:null,editar:false};
const pctN=(a,b)=>b?a/b:null;
const mesISO=d=>d.toISOString().slice(0,7)+'-01';
function diasUteis(ini,ate){ let n=0; for(let d=new Date(ini);d<=ate;d.setDate(d.getDate()+1)) if(d.getDay()!==0) n++; return n; } // seg a sáb
function barraMeta(real,meta,{marca=null,marcaTxt='',proj=null}={}){
  const topo=Math.max(meta||0,marca||0,real||0,proj||0)||1, w=v=>Math.min(100,(v/topo)*100).toFixed(1)+'%';
  const cor=meta?(real>=meta?'var(--ok)':(proj!=null&&proj>=meta?'var(--navy2)':'var(--morna)')):'var(--navy2)';
  return `<div style="position:relative;height:14px;background:#eef1f4;border-radius:7px;margin:6px 0 2px;overflow:visible">
    ${proj!=null&&proj>real?`<div style="position:absolute;left:0;top:0;bottom:0;width:${w(proj)};background:repeating-linear-gradient(45deg,#dfe6ee,#dfe6ee 4px,#eef1f4 4px,#eef1f4 8px);border-radius:7px"></div>`:''}
    <div style="position:absolute;left:0;top:0;bottom:0;width:${w(real)};background:${cor};border-radius:7px"></div>
    ${meta?`<div title="meta" style="position:absolute;top:-3px;bottom:-3px;left:${w(meta)};width:2px;background:var(--txt)"></div>`:''}
    ${marca?`<div title="${esc(marcaTxt)}" style="position:absolute;top:-3px;bottom:-3px;left:${w(marca)};width:2px;background:var(--quente)"></div>`:''}</div>`;
}
function somaLojas(ls){ const s={}; const campos=['faturamento','mc','pedidos','pedidos_sem_vendedor','atividades','capas_novas','orcamentos','orcamentos_valor','ganhos','perdidos','carteira','carteira_qtd','quentes','vencidos','pe_mc_mensal','meta_faturamento','meta_mc','meta_atividades','meta_capas_novas'];
  campos.forEach(c=>{ const vs=ls.map(l=>l[c]).filter(v=>v!=null); s[c]=vs.length?vs.reduce((a,b)=>a+Number(b),0):null; });
  s.codigo='PVA + RV'; s.nome='Ambas as lojas'; const pisos=ls.map(l=>l.meta_mc_pct_min).filter(v=>v!=null); s.meta_mc_pct_min=pisos.length?Math.max(...pisos):null; return s; }

      ${pr!=null?`<div class="mut">no ritmo atual fecha o mês em <b>${extra.fmt?extra.fmt(Math.round(pr)):brl(pr)}</b>${meta?(pr>=meta?' ✓':` (faltam ${extra.fmt?extra.fmt(Math.ceil(meta-real)):brl(meta-real)} → ${extra.fmt?Math.ceil((meta-real)/Math.max(duTot-duPass,1)):brl((meta-real)/Math.max(duTot-duPass,1))}/dia útil)`):''}</div>`:''}</div>`; };
  // gráfico: MC acumulada por dia × ponto de equilíbrio × meta
  const grafico=()=>{ const W=1000,H=210,pl=8,pr=8,pt=14,pb=20, nd=fim.getDate(); const ac=[]; let s=0; const porDia={}; (P.diario||[]).forEach(x=>porDia[+x.d.slice(8,10)]=Number(x.mc||0));
    const ultimo=passado?nd:corrente?hj.getDate():0; for(let d=1;d<=ultimo;d++){ s+=porDia[d]||0; ac.push([d,s]); }
    const alvo=[L.pe_mc_mensal,L.meta_mc].filter(Boolean), topo=Math.max(s,...alvo,1)*1.08;
    const x=d=>pl+(d-1)/(nd-1)*(W-pl-pr), y=v=>pt+(1-v/topo)*(H-pt-pb);
    const linha=(v,cor,t,dy)=>v?`<line x1="${x(1)}" x2="${x(nd)}" y1="${y(0)}" y2="${y(v)}" stroke="${cor}" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${pl+4}" y="${pt+4+dy}" font-size="12" fill="${cor}">– – ${t} ${brl(v)}</text>`:'';
    const acima=L.meta_mc&&L.pe_mc_mensal?(L.meta_mc>L.pe_mc_mensal?'meta':'pe'):null;
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="MC acumulada no mês">
      <line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="#cfd6de"/>
      ${linha(L.pe_mc_mensal,'#c62828','ponto de equilíbrio',acima==='meta'?18:0)}${L.meta_mc&&L.meta_mc!==L.pe_mc_mensal?linha(L.meta_mc,'#1d2733','meta',acima==='meta'?0:18):''}
      ${ac.length?`<polyline fill="none" stroke="#2c4f7c" stroke-width="2.5" points="${ac.map(([d,v])=>x(d)+','+y(v)).join(' ')}"/><circle cx="${x(ac.at(-1)[0])}" cy="${y(ac.at(-1)[1])}" r="4" fill="#2c4f7c"/>`:''}
      ${[1,10,20,nd].map(d=>`<text x="${x(d)}" y="${H-5}" font-size="12" fill="#6b7684" text-anchor="${d===1?'start':d===nd?'end':'middle'}">${d}</text>`).join('')}</svg>
      <p class="mut">Linha azul = MC acumulada dos pedidos (por data de fechamento). Linhas tracejadas = quanto deveria estar acumulado em cada dia para chegar ao ponto de equilíbrio / meta.</p>`; };
  const vs=P.vendedores||[];
  const pisoV=v=>v.meta_mc_pct_min ?? P.lojas.find(l=>l.id===v.loja_id)?.meta_mc_pct_min;
  const celMeta=(real,meta,fmt=brl)=>`${fmt(real)}${meta?`<div class="mut" style="font-size:11px">${pct(real/meta)} de ${fmt(meta)}</div>`:''}`;

   <p class="mut">${esc(L.codigo)} – ${esc(L.nome)} · ${corrente?`dia útil ${duPass} de ${duTot} (seg a sáb)`:passado?'mês encerrado':'mês futuro'}${L.pedidos_sem_vendedor?` · <span class="atras">${L.pedidos_sem_vendedor} pedido(s) em capa sem vendedor</span>`:''}</p>
   <div class="g3" style="gap:12px;margin-bottom:12px">

     <div class="card" style="margin:0"><div class="mut">MC % média</div><div style="font-size:22px;font-weight:bold;color:${piso&&mcPct!=null&&mcPct<piso?'var(--quente)':'var(--navy)'}">${pct(mcPct)}</div>

   </div>
   <div class="card"><h3>MC acumulada no mês</h3><div style="overflow-x:auto"><div style="min-width:620px">${grafico()}</div></div></div>
   <div class="card"><h3>Ranking dos vendedores</h3><div class="tbl"><table>
     <tr><th>Vendedor</th>${P.lojas.length>1?'<th>Loja</th>':''}<th style="text-align:right">Faturamento</th><th style="text-align:right">MC</th><th style="text-align:right">MC %</th><th style="text-align:right">Pedidos</th><th style="text-align:right">Contatos</th><th style="text-align:right">Capas novas</th><th style="text-align:right">Orçamentos</th><th style="text-align:right">Conversão</th><th style="text-align:right">Carteira</th></tr>
     ${vs.map((v,i)=>{const mp=pctN(v.mc,v.faturamento), pz=pisoV(v), cv=pctN(v.ganhos,v.ganhos+v.perdidos), eu=v.id===EU.id;
       return `<tr style="${eu?'background:#fffbea':''}"><td>${i+1}. <b>${esc(v.nome)}</b></td>${P.lojas.length>1?`<td>${esc(LOJAS.find(l=>l.id===v.loja_id)?.codigo||'')}</td>`:''}
       <td style="text-align:right">${celMeta(Number(v.faturamento),v.meta_faturamento)}</td><td style="text-align:right">${celMeta(Number(v.mc),v.meta_mc)}</td>
       <td style="text-align:right" class="${pz&&mp!=null&&mp<pz?'atras':''}">${pct(mp)}</td><td style="text-align:right">${int(v.pedidos)}</td>
       <td style="text-align:right">${celMeta(v.atividades,v.meta_atividades,int)}</td><td style="text-align:right">${celMeta(v.capas_novas,v.meta_capas_novas,int)}</td>
       <td style="text-align:right">${int(v.orcamentos)}</td><td style="text-align:right">${cv==null?'-':pct(cv)}<div class="mut" style="font-size:11px">${v.ganhos} ganho · ${v.perdidos} perdido</div></td>
       <td style="text-align:right">${brl(v.carteira)}${v.quentes?`<div style="font-size:11px"><span class="pill Quente">${v.quentes} quente</span></div>`:''}</td></tr>`}).join('')||`<tr><td colspan="11" class="mut">Nenhum vendedor com movimento no mês.</td></tr>`}
   </table></div><p class="mut">Contatos = atividades da linha do tempo (visitas, ligações, WhatsApp, mapeamentos, follow-up), sem contar "Orçamento enviado". Conversão = orçamentos emitidos no mês que viraram pedido ÷ (ganhos + perdidos). MC % em vermelho = abaixo do piso.</p></div>
   <div class="g2" style="gap:12px">
     <div class="card"><h3>Funil do mês</h3>
       ${[['Capas novas',L.capas_novas,L.meta_capas_novas],['Contatos de prospecção',L.atividades,L.meta_atividades],['Orçamentos emitidos',L.orcamentos,null],['Viraram pedido',L.ganhos,null],['Perdidos',L.perdidos,null]].map(([t,v,m])=>{const topo=Math.max(L.capas_novas||0,L.atividades||0,L.orcamentos||0,1);
         return `<div style="margin:6px 0"><div class="linha" style="justify-content:space-between"><span>${t}</span><b>${int(v)}${m?` <span class="mut">/ meta ${m}</span>`:''}</b></div>
         <div style="height:8px;background:#eef1f4;border-radius:4px"><div style="height:8px;width:${Math.min(100,(v||0)/topo*100)}%;background:${t==='Perdidos'?'var(--quente)':'var(--navy2)'};border-radius:4px"></div></div></div>`}).join('')}
       <p class="mut">Valor orçado no mês: <b>${brl(L.orcamentos_valor)}</b> · conversão ${conv==null?'-':pct(conv)}</p>
       <h3 style="margin-top:14px">Carteira em negociação</h3>
       <div class="kpis"><div class="kpi"><b>${brl(L.carteira)}</b><span>${int(L.carteira_qtd)} orçamento(s)</span></div><div class="kpi"><b style="color:var(--quente)">${int(L.quentes)}</b><span>quentes</span></div><div class="kpi"><b class="${L.vencidos?'atras':''}">${int(L.vencidos)}</b><span>com validade vencida</span></div></div></div>
     <div class="card"><h3>Perdas por motivo (orçamentos do mês)</h3>
       ${(P.perdas||[]).length?`<table>${P.perdas.map(p=>`<tr><td>${esc(p.motivo)}</td><td style="text-align:right">${p.qtd}</td><td style="text-align:right">${brl(p.valor)}</td></tr>`).join('')}</table>`:'<p class="mut">Nenhuma perda registrada no mês.</p>'}
       <h3 style="margin-top:14px">Atividades por tipo</h3>
       ${(P.atividades_tipo||[]).length?`<table>${P.atividades_tipo.map(a=>`<tr><td>${esc(a.tipo)}</td><td style="text-align:right">${a.qtd}</td></tr>`).join('')}</table>`:'<p class="mut">Nenhuma atividade no mês.</p>'}</div>
   </div>`;
  $('#pnAnt').onclick=()=>{PNL.mes=new Date(ini.getFullYear(),ini.getMonth()-1,1);telaPainel();};
  $('#pnProx').onclick=()=>{PNL.mes=new Date(ini.getFullYear(),ini.getMonth()+1,1);telaPainel();};
  if($('#pnMetas')) $('#pnMetas').onclick=()=>{PNL.editar=true;telaPainel();};
}

async function editarMetas(P,lojaSel){
  const ini=new Date(PNL.mes), mes=mesISO(ini), ant=mesISO(new Date(ini.getFullYear(),ini.getMonth()-1,1));
  const lojasIds=lojaSel?[lojaSel]:(ehDirecao()?LOJAS.map(l=>l.id):[EU.loja_id]);
  const [{data:ms,error:e1},{data:us,error:e2}]=await Promise.all([
    sb.from('metas').select('*').in('loja_id',lojasIds).in('mes',[mes,ant]),
    sb.from('usuarios').select('id,nome,loja_id,papel').eq('ativo',true).in('loja_id',lojasIds).in('papel',['vendedor','gerente']).order('nome')]);
  if(e1||e2) return erro(e1||e2);
  const achar=(l,u,m)=>(ms||[]).find(x=>x.loja_id===l&&(x.usuario_id||null)===(u||null)&&x.mes===m);
  const campos=[['faturamento','Faturamento R$',0],['mc','MC R$',0],['mc_pct_min','MC % mínima',1],['atividades','Contatos',0],['capas_novas','Capas novas',0]];
  const linhas=[]; lojasIds.forEach(l=>{ linhas.push({l,u:null,nome:'Loja (total)'}); (us||[]).filter(u=>u.loja_id===l).forEach(u=>linhas.push({l,u:u.id,nome:u.nome})); });
  // quem aparece no painel (ex.: admin que atende) também pode ter meta
  (P.vendedores||[]).forEach(v=>{ if(lojasIds.includes(v.loja_id)&&!linhas.some(x=>x.u===v.id&&x.l===v.loja_id)) linhas.push({l:v.loja_id,u:v.id,nome:v.nome}); });
  const val=(r,f,pc)=>{const v=r?.[f]; return v==null?'':pc?(v*100).toFixed(1):v;};
  const nomeMes=ini.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  $('#conteudo').innerHTML=`<div class="linha" style="justify-content:space-between"><h2 style="margin:4px 0;color:var(--navy)">Metas de ${esc(nomeMes)}</h2>
    <div class="linha"><button class="sec" id="mtCopiar">Copiar do mês anterior</button><button id="mtVoltar">Voltar ao painel</button></div></div>
   <p class="mut">Cada campo salva ao sair dele. Deixe vazio para "sem meta". A MC % mínima da loja vale como piso para quem não tiver piso próprio. O ponto de equilíbrio continua em Parâmetros.</p>
   ${lojasIds.map(l=>{const lj=LOJAS.find(x=>x.id===l); const pe=P.lojas.find(x=>x.id===l)?.pe_mc_mensal;
     return `<div class="card"><h3>${esc(lj?.codigo)} – ${esc(lj?.nome)} <span class="mut" style="font-weight:normal">· ponto de equilíbrio ${brl(pe)}</span></h3><div class="tbl"><table>
     <tr><th>Quem</th>${campos.map(c=>`<th>${c[1]}</th>`).join('')}</tr>
     ${linhas.filter(x=>x.l===l).map(x=>{const r=achar(l,x.u,mes); return `<tr style="${x.u?'':'background:#f5f8fb;font-weight:bold'}"><td>${esc(x.nome)}</td>${campos.map(([f,,pc])=>`<td><input type="number" step="${pc?'0.1':'1'}" min="0" style="min-width:95px" data-mt="${l}|${x.u||''}" data-f="${f}" data-pct="${pc}" value="${val(r,f,pc)}"></td>`).join('')}</tr>`}).join('')}
     </table></div>${(us||[]).some(u=>u.loja_id===l)?'':'<p class="mut">Nenhum vendedor ativo nesta loja ainda — libere em Usuários (papel vendedor).</p>'}</div>`}).join('')}`;
  $('#mtVoltar').onclick=()=>{PNL.editar=false;telaPainel();};
  const salvar=async(l,u,patch)=>{ const r=achar(l,u,mes);
    if(r){ const {error}=await sb.from('metas').update(patch).eq('id',r.id); if(error) throw error; Object.assign(r,patch); }
    else { const {data,error}=await sb.from('metas').insert({loja_id:l,usuario_id:u,mes,...patch}).select().single(); if(error) throw error; ms.push(data); } };
  document.querySelectorAll('[data-mt]').forEach(el=>el.onchange=async()=>{ const [l,u]=el.dataset.mt.split('|'); let v=el.value===''?null:Number(el.value.replace(',','.'));
    if(v!=null&&el.dataset.pct==='1') v=v/100; try{ await salvar(+l,u||null,{[el.dataset.f]:v}); toast('Salvo ✓'); }catch(e){ erro(e); } });
  $('#mtCopiar').onclick=async()=>{ const velhas=(ms||[]).filter(x=>x.mes===ant); if(!velhas.length) return toast('Mês anterior sem metas');
    if(!confirm(`Copiar ${velhas.length} meta(s) do mês anterior? Os valores deste mês serão substituídos.`)) return;
    try{ for(const v of velhas) await salvar(v.loja_id,v.usuario_id,{faturamento:v.faturamento,mc:v.mc,mc_pct_min:v.mc_pct_min,atividades:v.atividades,capas_novas:v.capas_novas}); toast('Metas copiadas'); editarMetas(P,lojaSel); }catch(e){ erro(e); } };
}

async function telaUsuarios(){
  if(!ehDirecao()) return telaLista();
  const {data}=await sb.from('usuarios').select('*').order('ativo').order('nome');
  const papeis=['vendedor','gerente','direcao','admin','logistica','financeiro','compras'];
  $('#conteudo').innerHTML=`<h2 style="color:var(--navy)">Usuários</h2>
  <p class="mut">Quem cria acesso entra bloqueado. Marque "Ativo", escolha a loja e o papel para liberar. Direção e admin veem as duas lojas; para outro papel ver as duas, marque "Vê as duas lojas".</p>
  <div class="card tbl"><table><tr><th>Nome</th><th>E-mail</th><th>Ativo</th><th>Loja</th><th>Papel</th><th>Vê as duas lojas</th></tr>
  ${(data||[]).map(u=>`<tr style="${u.ativo?'':'background:#fff8e6'}"><td>${esc(u.nome)}</td><td class="mut">${esc(u.email)}</td>
    <td><input type="checkbox" data-t="usuarios" data-f="ativo" data-id="${u.id}" ${u.ativo?'checked':''} ${u.id===EU.id?'disabled':''} style="width:22px;height:22px"></td>
    <td><select data-t="usuarios" data-f="loja_id" data-id="${u.id}"><option value=""></option>${LOJAS.map(l=>`<option value="${l.id}" ${l.id===u.loja_id?'selected':''}>${esc(l.codigo)}</option>`).join('')}</select></td>
    <td><select data-t="usuarios" data-f="papel" data-id="${u.id}" ${u.id===EU.id?'disabled':''}>${papeis.map(p=>`<option ${p===u.papel?'selected':''}>${p}</option>`).join('')}</select></td>
    <td>${['direcao','admin'].includes(u.papel)?'<span class="mut">sempre</span>':`<input type="checkbox" data-t="usuarios" data-f="todas_lojas" data-id="${u.id}" ${u.todas_lojas?'checked':''} style="width:22px;height:22px">`}</td></tr>`).join('')}
  </table></div>`;
  ligarCampos($('#conteudo'));
}
</script>
