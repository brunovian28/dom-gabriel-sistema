<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<title>Dom Gabriel · Sistema</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#1F3A5F;--navy2:#2c4f7c;--gold:#C9A227;--bg:#F4F5F7;--card:#fff;--txt:#1d2733;--mut:#6b7684;--bd:#e2e6ea;
--quente:#c62828;--morna:#e08e0b;--fria:#1e6fb8;--ok:#2e7d32}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--navy);color:#fff}
button.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}button.link{background:none;color:var(--navy);padding:4px 6px}
button.gold{background:var(--gold);color:#1d2733}button.del{background:none;color:#b00;padding:4px 8px}
input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--txt)}
input:disabled,select:disabled,textarea:disabled{background:#f2f3f5;color:#555}
textarea{min-height:60px;resize:vertical}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.hide{display:none!important}.mut{color:var(--mut);font-size:13px}
/* layout */
#topo{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
#topo b{font-size:16px}#topo small{color:#cfd8e3}
#corpo{display:flex;min-height:calc(100% - 52px)}
#menu{width:220px;background:#fff;border-right:1px solid var(--bd);padding:12px 8px;flex-shrink:0}
#menu a{display:block;padding:10px 12px;border-radius:8px;color:var(--txt);text-decoration:none;margin-bottom:2px}
#menu a.on{background:#eef3f9;color:var(--navy);font-weight:bold}
#conteudo{flex:1;padding:16px;max-width:1200px;margin:0 auto;width:100%;padding-bottom:90px}
#menuMob{display:none}
@media (max-width:800px){#menu{display:none}#menuMob{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
#menuMob a{flex:1;text-align:center;padding:10px 4px;font-size:12px;color:var(--mut);text-decoration:none}#menuMob a.on{color:var(--navy);font-weight:bold}#conteudo{padding:12px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px;color:var(--navy)}
.linha{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
@media (max-width:800px){.g2,.g3{grid-template-columns:1fr}}
.pill{display:inline-block;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:bold;color:#fff}
.kpi .pill{color:#fff!important;font-size:13px}.Quente{background:var(--quente)}.Morna{background:var(--morna)}.Fria{background:var(--fria)}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.capaCard{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px;cursor:pointer}
.capaCard:hover{border-color:var(--navy2)}
.capaCard .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.atras{color:var(--quente);font-weight:bold}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--bd);margin:8px 0 12px;scrollbar-width:none}
.tabs a{padding:9px 12px;white-space:nowrap;color:var(--mut);text-decoration:none;border-bottom:3px solid transparent}
.tabs a.on{color:var(--navy);border-color:var(--gold);font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}th{color:var(--mut);font-weight:normal;font-size:12px}
.tbl{overflow-x:auto}
.item{border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:8px;background:#fff}
.sug{border:1px solid var(--bd);border-radius:8px;max-height:260px;overflow:auto;background:#fff}
.sug div{padding:8px 10px;border-bottom:1px solid var(--bd);cursor:pointer}.sug div:hover{background:#f5f7fa}
.kpis{display:flex;gap:10px;flex-wrap:wrap}.kpi{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:8px 12px}.kpi b{display:block;font-size:17px;color:var(--navy)}.kpi span{font-size:12px;color:var(--mut)}
#toast{position:fixed;right:16px;bottom:80px;background:#1d2733;color:#fff;padding:9px 14px;border-radius:8px;opacity:0;transition:.2s;z-index:50;font-size:14px}
#toast.on{opacity:.93}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;z-index:40;padding:40px 12px;overflow:auto}
.modal .card{max-width:520px;width:100%}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.chk input[type=checkbox]{width:22px;height:22px;flex-shrink:0}
.chk .txt{flex:1}.chk input[type=date]{width:150px}
#login{max-width:380px;margin:60px auto}
.aviso{background:#fff4e0;color:#8a5200;padding:8px 10px;border-radius:8px;font-size:13px;margin:6px 0}
.erro{background:#fdecea;color:#b00;padding:8px 10px;border-radius:8px;font-size:13px;margin:6px 0}
</style>
</head>
<body>
<div id="topo"><div><b>Dom Gabriel</b> <small>· Sistema interno</small></div><div id="quem" class="mut" style="color:#cfd8e3"></div></div>

<div id="login" class="card">
  <h3>Entrar</h3>
  <label>E-mail</label><input id="lEmail" type="email" autocomplete="username">
  <label>Senha</label><input id="lSenha" type="password" autocomplete="current-password">
  <div id="lNomeBox" class="hide"><label>Seu nome completo</label><input id="lNome"></div>
  <div class="linha" style="margin-top:12px"><button id="bEntrar">Entrar</button><button class="sec" id="bCriar">Criar meu acesso</button></div>
  <div id="lMsg"></div>
</div>

<div id="corpo" class="hide">
  <nav id="menu"></nav>
  <main id="conteudo"></main>
</div>
<nav id="menuMob" class="hide"></nav>
<div id="toast"></div>
<div id="modal"></div>

<script>
const sb = supabase.createClient('https://vmpxssoyqfdnnyhnvkyl.supabase.co','sb_publishable_NXQa66tcvLT7k_uib2UAeg_E0as2h7M');
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dBR = d => d ? new Date(d + (d.length===10?'T12:00:00':'')).toLocaleDateString('pt-BR') : '';
const hoje = () => new Date().toISOString().slice(0,10);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600);}
function erro(e){ console.error(e); toast('Erro: '+(e.message||e)); }
window.addEventListener('unhandledrejection',e=>erro(e.reason||e));

let EU=null, LOJAS=[], OP={}, CAPA=null;
const ehDirecao = () => ['admin','direcao'].includes(EU?.papel);

// ================= LOGIN =================
let modoCriar=false;
$('#bCriar').onclick=async()=>{
  if(!modoCriar){modoCriar=true;$('#lNomeBox').classList.remove('hide');$('#bCriar').textContent='Enviar cadastro';return;}
  const {error}=await sb.auth.signUp({email:$('#lEmail').value.trim(),password:$('#lSenha').value,options:{data:{nome:$('#lNome').value.trim()}}});
  $('#lMsg').innerHTML = error ? `<div class="erro">${esc(error.message)}</div>` : `<div class="aviso">Cadastro enviado. Confirme pelo e-mail e aguarde a direção liberar seu acesso.</div>`;
};
$('#bEntrar').onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$('#lEmail').value.trim(),password:$('#lSenha').value});
  if(error) return $('#lMsg').innerHTML=`<div class="erro">Não foi possível entrar: ${esc(error.message)}</div>`;
  iniciar();
};
$('#lSenha').addEventListener('keydown',e=>{if(e.key==='Enter')$('#bEntrar').click()});

async function iniciar(){
  const {data:{user}}=await sb.auth.getUser(); if(!user) return;
  const {data:eu}=await sb.from('usuarios').select('*').eq('id',user.id).maybeSingle();
  if(!eu||!eu.ativo){ $('#lMsg').innerHTML='<div class="aviso">Seu acesso ainda não foi liberado pela direção.</div>'; await sb.auth.signOut(); return; }
  EU=eu;
  const [{data:lj},{data:op}]=await Promise.all([sb.from('lojas').select('*').order('id'), sb.from('listas_opcoes').select('lista,valor,ordem').eq('ativo',true).order('ordem')]);
  LOJAS=lj||[]; OP={}; (op||[]).forEach(o=>(OP[o.lista]=OP[o.lista]||[]).push(o.valor));
  $('#login').classList.add('hide'); $('#corpo').classList.remove('hide'); $('#menuMob').classList.remove('hide');
  $('#quem').innerHTML=`${esc(eu.nome)} · ${esc(eu.papel)} <button class="link" style="color:#fff" id="sair">Sair</button>`;
  $('#sair').onclick=async()=>{await sb.auth.signOut();location.hash='';location.reload();};
  montarMenu(); rota();
}
sb.auth.getSession().then(({data})=>{ if(data.session) iniciar(); });

// ================= NAVEGAÇÃO =================
function montarMenu(){
  const itens=[['#/capas','Capas'],['#/nova','+ Nova capa'],['#/profissionais','Profissionais']]; if(ehDirecao()) itens.push(['#/usuarios','Usuários'],['#/parametros','Parâmetros'],['#/condicoes','Condições de pagamento'],['#/conferencia-st','Conferência de ST']);
  $('#menu').innerHTML=itens.map(([h,t])=>`<a href="${h}">${t}</a>`).join('')+`<p class="mut" style="padding:12px">Loja: ${esc(LOJAS.find(l=>l.id===EU.loja_id)?.codigo||'-')}</p>`;
  $('#menuMob').innerHTML=itens.map(([h,t])=>`<a href="${h}">${t}</a>`).join('');
}
window.addEventListener('hashchange',rota);
function rota(){
  if(!EU) return; const h=location.hash||'#/capas';
  document.querySelectorAll('#menu a,#menuMob a').forEach(a=>a.classList.toggle('on',h.startsWith(a.getAttribute('href'))));
  if(h.startsWith('#/capa/')) return abrirCapa(h.split('/')[2]);
  if(h==='#/nova') return novaCapa();
  if(h==='#/usuarios') return telaUsuarios();
  if(h==='#/parametros') return telaParametros();
  if(h==='#/conferencia-st') return telaConfST();
  if(h==='#/profissionais') return telaProfissionais();
  if(h==='#/condicoes') return telaCondicoes();
  telaLista();
}
const sel=(lista,val,attrs='')=>`<select ${attrs}><option value=""></option>${(OP[lista]||[]).map(v=>`<option ${v===val?'selected':''}>${esc(v)}</option>`).join('')}</select>`;

// ================= LISTA DE CAPAS =================
let filtro={escopo:'minhas',status:'abertas',busca:''};
async function telaLista(){
  $('#conteudo').innerHTML=`
  <div class="linha" style="justify-content:space-between"><h2 style="margin:4px 0;color:var(--navy)">Capas de atendimento</h2><button class="gold" onclick="location.hash='#/nova'">+ Nova capa</button></div>
  <div class="card"><div class="g3">
    <div><label>Buscar (nome, WhatsApp, endereço, nº)</label><input id="fBusca" value="${esc(filtro.busca)}" placeholder="ex.: Juliana, 66999…, Rua…"></div>
    <div><label>Mostrar</label><select id="fEscopo"><option value="minhas">Minhas capas</option><option value="loja">Todas da loja</option>${ehDirecao()?'<option value="todas">Todas as lojas</option>'+LOJAS.map(l=>`<option value="l${l.id}">Só ${esc(l.codigo)} – ${esc(l.nome)}</option>`).join(''):''}</select></div>
    <div><label>Status</label><select id="fStatus"><option value="abertas">Em andamento</option><option value="todas">Todos</option>${(OP.status_capa||[]).map(s=>`<option>${esc(s)}</option>`).join('')}</select></div>
  </div></div>
  <div id="kpis" class="kpis" style="margin-bottom:12px"></div>
  <div id="res" class="lista"><p class="mut">Carregando…</p></div>`;
  $('#fEscopo').value=filtro.escopo; $('#fStatus').value=filtro.status;
  let t; $('#fBusca').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{filtro.busca=e.target.value;carregarLista()},300)};
  $('#fEscopo').onchange=e=>{filtro.escopo=e.target.value;carregarLista()};
  $('#fStatus').onchange=e=>{filtro.status=e.target.value;carregarLista()};
  carregarLista();
}
async function carregarLista(){
  let q=sb.from('vw_capas_lista').select('*').order('proximo_passo_data',{ascending:true,nullsFirst:false}).limit(300);
  if(filtro.escopo==='minhas') q=q.eq('vendedor_id',EU.id);
  else if(filtro.escopo==='loja') q=q.eq('loja_id',EU.loja_id);
  else if(/^l\d+$/.test(filtro.escopo)) q=q.eq('loja_id',+filtro.escopo.slice(1));
  if(filtro.status==='abertas') q=q.in('status',['Aberta','Em orçamento']);
  else if(filtro.status!=='todas') q=q.eq('status',filtro.status);
  const b=filtro.busca.trim().toLowerCase(); if(b) q=q.ilike('busca','%'+b.replace(/[%_]/g,'')+'%');
  const {data,error}=await q; if(error) return erro(error);
  const tot=data.reduce((s,c)=>s+Number(c.valor_em_negociacao||0),0), atras=data.filter(c=>c.proximo_passo_atrasado).length;
  const cnt=t=>data.filter(c=>c.temperatura===t).length;
  $('#kpis').innerHTML=`<div class="kpi"><b>${data.length}</b><span>capas</span></div><div class="kpi"><b>${brl(tot)}</b><span>em negociação (quentes)</span></div>
    <div class="kpi"><b><span class="pill Quente">${cnt('Quente')}</span> <span class="pill Morna">${cnt('Morna')}</span> <span class="pill Fria">${cnt('Fria')}</span></b><span>quentes · mornas · frias</span></div>
    <div class="kpi"><b class="${atras?'atras':''}">${atras}</b><span>próximo passo atrasado</span></div>`;
  $('#res').innerHTML = data.length ? data.map(c=>`
    <div class="capaCard" onclick="location.hash='#/capa/${c.id}'">
      <div class="t"><b>${esc(c.pessoas_nomes||'(sem cliente vinculado)')}</b><span class="pill ${c.temperatura}">${c.temperatura}</span></div>
      <div class="mut">${esc(c.numero)} · ${esc(c.status)} · ${esc(c.vendedor_nome||'')}</div>
      <div class="mut">${esc([c.endereco,c.bairro].filter(Boolean).join(' – ')||'obra sem endereço')}${c.etapa?' · '+esc(c.etapa):''}</div>
      <div style="margin-top:6px">${c.valor_em_negociacao>0?`<b>${brl(c.valor_em_negociacao)}</b> em negociação · `:''}
        <span class="${c.proximo_passo_atrasado?'atras':''}">${c.proximo_passo?`Próximo: ${esc(c.proximo_passo)}${c.proximo_passo_data?' ('+dBR(c.proximo_passo_data)+')':''}`:'<span class="atras">sem próximo passo</span>'}</span></div>
    </div>`).join('') : '<p class="mut">Nenhuma capa encontrada.</p>';
}

// ================= NOVA CAPA =================
function novaCapa(){
  $('#conteudo').innerHTML=`<div class="card" style="max-width:560px">
    <h3>Nova Capa de Atendimento</h3>
    <label>Loja</label><select id="nLoja" ${ehDirecao()?'':'disabled'}>${LOJAS.map(l=>`<option value="${l.id}" ${l.id===EU.loja_id?'selected':''}>${esc(l.codigo)} – ${esc(l.nome)}</option>`).join('')}</select>
    <label>Tipo de entrada</label>${sel('tipo_entrada','','id="nTipo"')}
    <label>Origem do cliente</label>${sel('origem','','id="nOrigem"')}
    <label>Detalhe da origem (quem indicou, qual arquiteto…)</label><input id="nDet">
    <label>Endereço da obra (se já souber)</label><input id="nEnd">
    <div class="linha" style="margin-top:14px"><button class="gold" id="nCriar">Criar capa</button><button class="sec" onclick="history.back()">Cancelar</button></div>
    <div id="nMsg"></div></div>`;
  $('#nCriar').onclick=async()=>{
    if(!$('#nTipo').value||!$('#nOrigem').value) return $('#nMsg').innerHTML='<div class="erro">Informe o tipo de entrada e a origem.</div>';
    const loja=+$('#nLoja').value;
    const {data:ob,error:e1}=await sb.from('obras').insert({loja_id:loja,endereco:$('#nEnd').value||null,criado_por:EU.id}).select().single(); if(e1) return erro(e1);
    const {data:c,error:e2}=await sb.from('capas').insert({loja_id:loja,obra_id:ob.id,vendedor_id:EU.id,tipo_entrada:$('#nTipo').value,origem:$('#nOrigem').value,origem_detalhe:$('#nDet').value||null}).select().single(); if(e2) return erro(e2);
    await sb.from('atividades').insert({capa_id:c.id,obra_id:ob.id,usuario_id:EU.id,loja_id:loja,tipo:$('#nTipo').value==='Prospecção ativa'?'Mapeamento de obra':'Visita do cliente à loja',resumo:'Abertura da capa'});
    toast('Capa '+c.numero+' criada'); location.hash='#/capa/'+c.id;
  };
}

// ================= CAPA =================
let abaAtual='quem';
async function abrirCapa(id){
  $('#conteudo').innerHTML='<p class="mut">Carregando capa…</p>';
  const {data:c,error}=await sb.from('capas').select('*').eq('id',id).single(); if(error) return erro(error);
  const {data:ob}=c.obra_id?await sb.from('obras').select('*').eq('id',c.obra_id).single():{data:null};
  CAPA={c,ob,podeEditar: ehDirecao() || c.vendedor_id===EU.id || (EU.papel==='gerente'&&c.loja_id===EU.loja_id)};
  const vend=c.vendedor_id?(await sb.from('usuarios').select('nome').eq('id',c.vendedor_id).maybeSingle()).data:null;
  const dis=CAPA.podeEditar?'':'disabled';
  $('#conteudo').innerHTML=`
   <div class="linha" style="justify-content:space-between"><button class="link" onclick="location.hash='#/capas'">← Capas</button><span class="mut">${CAPA.podeEditar?'':'Somente leitura (capa de outro vendedor) — você pode registrar produtos vistos e contatos.'}</span></div>
   <div class="card">
     <div class="linha" style="justify-content:space-between"><div><b style="font-size:18px">${esc(c.numero)}</b> <span class="mut">· aberta em ${dBR(c.data_abertura)} · ${esc(vend?.nome||'')}</span></div><div id="resumo"></div></div>
     <div class="g3">
       <div><label>Status</label>${sel('status_capa',c.status,`data-t="capas" data-f="status" ${dis}`)}</div>
       <div><label>Próximo passo (obrigatório)</label><input data-t="capas" data-f="proximo_passo" value="${esc(c.proximo_passo)}" ${dis}></div>
       <div><label>Data do próximo passo</label><input type="date" data-t="capas" data-f="proximo_passo_data" value="${c.proximo_passo_data||''}" ${dis}></div>
     </div>
     <div id="perdaBox" class="${c.status==='Perdida'?'':'hide'}"><label>Motivo da perda</label>${sel('motivo_perda',c.motivo_perda,`data-t="capas" data-f="motivo_perda" ${dis}`)}</div>
   </div>
   <div class="tabs">${[['quem','Quem e onde'],['bant','Qualificação'],['produtos','Produtos vistos'],['check','Checklist'],['orc','Orçamentos'],['negoc','Negociação'],['ped','Pedido'],['tempo','Linha do tempo']].map(([k,t])=>`<a href="#" data-aba="${k}" class="${k===abaAtual?'on':''}">${t}</a>`).join('')}</div>
   <div id="aba"></div>`;
  document.querySelectorAll('.tabs a').forEach(a=>a.onclick=e=>{e.preventDefault();abaAtual=a.dataset.aba;document.querySelectorAll('.tabs a').forEach(x=>x.classList.toggle('on',x===a));renderAba();});
  ligarCampos($('#conteudo')); atualizarResumo(); renderAba();
}
function ligarCampos(root){
  root.querySelectorAll('[data-t][data-f]').forEach(el=>{
    if(el._lig) return; el._lig=1;
    el.addEventListener('change',async()=>{
      const t=el.dataset.t, f=el.dataset.f; let v=el.type==='checkbox'?el.checked:el.value; if(v==='') v=null;
      if(el.type==='number'&&v!==null) v=Number(v);
      if(t==='capas'&&f==='falou_com_decisor') v = v===null?null:v==='Sim';
      const id = t==='capas'?CAPA.c.id : t==='obras'?CAPA.ob.id : el.dataset.id;
      const {error}=await sb.from(t).update({[f]:v}).eq('id',id); if(error) return erro(error);
      if(t==='capas'){CAPA.c[f]=v; if(f==='status') $('#perdaBox').classList.toggle('hide',v!=='Perdida');}
      toast('Salvo ✓'); atualizarResumo();
    });
  });
}
async function atualizarResumo(){
  const {data:r}=await sb.from('vw_capas_resumo').select('*').eq('id',CAPA.c.id).maybeSingle(); if(!r) return;
  $('#resumo').innerHTML=`<span class="pill ${r.temperatura}" title="BANT: B${r.bant_b} A${r.bant_a} N${r.bant_n} T${r.bant_t}">${r.temperatura} · ${r.pontos}/4</span>

const PDFJS_V='3.11.174';
let _pdfjs=null;
async function carregarPdfjs(){
  if(_pdfjs) return _pdfjs;
  await new Promise((ok,falha)=>{const s=document.createElement('script');s.src=`https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_V}/build/pdf.min.js`;s.onload=ok;s.onerror=()=>falha(new Error('Não consegui carregar o leitor de PDF'));document.head.appendChild(s);});
  _pdfjs=window.pdfjsLib; _pdfjs.GlobalWorkerOptions.workerSrc=`https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_V}/build/pdf.worker.min.js`;
  return _pdfjs;

// ===== Leitor de orçamento Santri (usa pdf.js). Funciona no navegador e no node =====
async function lerOrcamentoPDF(pdfjsLib, data){
  const doc = await pdfjsLib.getDocument({data}).promise;
  const linhas=[];
  for(let p=1;p<=doc.numPages;p++){
    const pg=await doc.getPage(p); const tc=await pg.getTextContent();
    const its=tc.items.filter(i=>i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4],y:Math.round(i.transform[5]),w:i.width}));
    const porY={}; its.forEach(i=>{const k=Object.keys(porY).find(y=>Math.abs(y-i.y)<=2); (porY[k??i.y]=porY[k??i.y]||[]).push(i);});
    Object.keys(porY).map(Number).sort((a,b)=>b-a).forEach(y=>linhas.push({pag:p,y,its:porY[y].sort((a,b)=>a.x-b.x)}));
  }
  const txt=l=>l.its.map(i=>i.s).join(' ');
  const num=s=>{s=String(s||'').trim();if(!s)return null;return Number(s.replace(/\./g,'').replace(',','.'))};
  const todo=linhas.map(txt).join('\n');
  const pega=(re)=>{const m=todo.match(re);return m?m[1].trim():null};
  const dt=s=>{const m=String(s||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?`${m[3]}-${m[2]}-${m[1]}`:null};
  const cab={
    numero: pega(/Orçamento:\s*([\d.]+)/), data_emissao: dt(pega(/Data emissão:\s*([\d\/]+)/)), data_validade: dt(pega(/Data de validade:\s*([\d\/]+)/)),
    vendedor: pega(/Vendedor:\s*(.+?)(?:\s+Fone|\n|$)/), condicao_pagamento: pega(/Condição de pagamento:\s*(.+)/),
    cliente: pega(/Cliente:\s*(.+?)(?:\s+A\/C:|\n|$)/), loja: pega(/DOM GABRIEL[^\n]*?-\s*(PVA|RV)/),
    eh_pedido: /Data de fechamento:/.test(todo), data_fechamento: dt(pega(/Data de fechamento:\s*([\d\/]+)/)), observacao: pega(/Observação:\s*(.+)/)
  };
  cab.cliente_codigo=(cab.cliente||'').match(/^([\d.]+)\s*-/)?.[1]?.replace(/\./g,'')||null;
  // quadro TOTAIS (pedido): Total produtos | Serviços adicionais | Valor desconto | Total pedido
  const totais={}; { const L=linhas.map(txt); const ih=L.findIndex(x=>/Total produtos/.test(x)&&/Serviços adicionais/.test(x));
    if(ih>=0){ const labs=['Total produtos','Serviços adicionais','Valor desconto','Total pedido'].filter(k=>L[ih].includes(k));
      const vals=(L[ih+1]||'').match(/[\d.]+,\d{2}/g)||[]; labs.forEach((k,j)=>{ if(vals[j]!=null) totais[k]=num(vals[j]); }); } }
  // colunas pelo cabeçalho da tabela
  const hl=linhas.find(l=>/Cod\. original/.test(txt(l)) && /Total/.test(txt(l)));
  if(!hl) throw new Error('Não encontrei a tabela de produtos neste PDF. É um orçamento do Santri?');
  const col={}; hl.its.forEach(i=>{const k=i.s.toLowerCase();
    if(k.startsWith('cod'))col.cod=i.x; else if(k==='produto')col.prod=i.x; else if(k.startsWith('descri'))col.desc=i.x; else if(k==='marca')col.marca=i.x;
    else if(k==='und')col.und=i.x; else if(k.startsWith('qtd'))col.qtd=i.x+i.w; else if(k.startsWith('preco'))col.preco=i.x+i.w; else if(k==='total')col.total=i.x+i.w;});
  const itens=[]; let amb=null; let ordem=0;
  const hdrIdx=linhas.indexOf(hl);
  for(const l of linhas.slice(hdrIdx+1)){
    const t=txt(l);
    if(/^TOTAIS/.test(t)||/Total produtos\s*$/.test(t)) break;
    if(/Cod\. original|Emitido em|ADM \d|Página:/.test(t)) continue;
    if(/Total produtos:/.test(t)) continue;
    // linha de item: tem número no fim (total) alinhado à coluna Total
    const ult=l.its[l.its.length-1];
    const temTotal = /^[\d.]+,\d{2}$/.test(ult.s) && Math.abs((ult.x+ult.w)-col.total)<40;
    if(temTotal && l.its.length>=6){
      const r=l.its; const nums=r.filter(i=>/^[\d.]+,\d+$/.test(i.s));
      const total=num(nums[nums.length-1].s), preco=num(nums[nums.length-2].s), qtd=num(nums[nums.length-3].s);
      const und=r.find(i=>Math.abs(i.x-col.und)<25 && /^[A-ZÇ]{1,4}\d?$/.test(i.s));
      const marca=r.filter(i=>i.x>=col.marca-5 && i.x<col.und-5).map(i=>i.s).join(' ');
      const desc=r.filter(i=>i.x>=col.desc-5 && i.x<col.marca-5).map(i=>i.s).join(' ');
      const pre=r.filter(i=>i.x<col.desc-5).map(i=>i.s).filter(s=>s!=='(*)');
      const codProd=pre.length?pre[pre.length-1]:null, codOrig=pre.length>1?pre[0].replace(/^\(\*\)\s*/,''):null;
      itens.push({ordem:++ordem,ambiente:amb,sob_encomenda:r.some(i=>i.s.startsWith('(*)')),codigo_original:codOrig,produto_id:codProd&&/^[\d.]+$/.test(codProd)?Number(codProd.replace(/\./g,'')):null,
        descricao:desc,marca,unidade:und?und.s:null,quantidade:qtd,preco_unitario:preco,total});
    } else if(!/\d{2}\/\d{2}\/\d{4}/.test(t) && l.its.every(i=>i.x>=col.prod-10 && i.x<col.marca+60)) {
      amb=t.trim();
    }
  }
  const tg=todo.match(/TOTAL GERAL[\s\S]*?([\d.]+,\d{2})\s*$/m); 
  const totalLinhas=linhas.map(txt); let totalGeral=null;
  const iTG=totalLinhas.findIndex(s=>/TOTAL GERAL/.test(s)); if(iTG>=0){ for(let k=iTG;k<Math.min(iTG+3,totalLinhas.length);k++){ const m=totalLinhas[k].match(/([\d.]+,\d{2})\s*$/); if(m){totalGeral=num(m[1]);} } }
  return {cabecalho:cab,itens,totais,total_geral:totalGeral ?? itens.reduce((s,i)=>s+i.total,0)};
}
// sugere grupos de opções: mesmo ambiente + mesma unidade + mesma quantidade
function sugerirOpcoes(itens){
  const grupos={}; let g=0;
  const chave=i=>`${i.ambiente}|${i.unidade}|${(i.quantidade||0).toFixed(3)}`;
  const cont={}; itens.forEach(i=>cont[chave(i)]=(cont[chave(i)]||0)+1);
  itens.forEach(i=>{ const k=chave(i); if(cont[k]>1){ if(!grupos[k]) grupos[k]=++g; i.grupo_opcao=grupos[k];
     i.opcao_confirmada=/OP[ÇC]/i.test(i.ambiente||''); } else { i.grupo_opcao=null; i.opcao_confirmada=false; } });
  // escolhido padrão: em cada grupo, o mais barato
  Object.values(grupos).forEach(gid=>{ const gs=itens.filter(i=>i.grupo_opcao===gid); const m=gs.reduce((a,b)=>b.total<a.total?b:a); gs.forEach(i=>i.escolhido=(i===m)); });
  itens.forEach(i=>{ if(i.grupo_opcao==null) i.escolhido=true; });
  return itens;
}
// valor provável: itens sem grupo + escolhido de cada grupo confirmado; grupo não confirmado conta tudo
function valorProvavel(itens){
  return itens.reduce((s,i)=> s + ( i.grupo_opcao==null ? i.total : (i.opcao_confirmada ? (i.escolhido?i.total:0) : i.total) ), 0);
}

function ligarBlocoItens(root, itens, rerender){

    it.grupo_opcao=null;it.opcao_confirmada=false;it.escolhido=true;const R=itens.filter(i=>i.grupo_opcao===g);
    if(R.length<2) R.forEach(i=>{i.grupo_opcao=null;i.opcao_confirmada=false;i.escolhido=true;}); else if(!R.some(i=>i.escolhido)){const m=R.reduce((a,c)=>c.total<a.total?c:a);m.escolhido=true;}

  root.querySelectorAll('[data-conf]').forEach(b=>b.onclick=()=>{const g=+b.dataset.conf;const G=itens.filter(i=>i.grupo_opcao===g);

async function salvarOrcamento(reg, itens, existentes){

  if(existentes&&existentes.length){ await sb.from('orcamentos').update({status:'Substituído (nova versão)',quente:false}).in('id',existentes.map(e=>e.id)); }
  const {data:o,error}=await sb.from('orcamentos').insert(reg).select().single();
  if(error){ erro(error.code==='23505'?{message:'Já existe um orçamento quente neste momento. Salve como "não quente" ou desmarque o outro.'}:error); return false; }
  if(itens&&itens.length){
    const ids=[...new Set(itens.map(i=>i.produto_id).filter(Boolean))];
    const {data:exist}=ids.length?await sb.from('produtos').select('id').in('id',ids):{data:[]};
    const ok=new Set((exist||[]).map(x=>x.id));
    const rows=itens.map(i=>({orcamento_id:o.id,ordem:i.ordem,ambiente:i.ambiente,ambiente_com_opcoes:/OP[ÇC]/i.test(i.ambiente||''),produto_id:ok.has(i.produto_id)?i.produto_id:null,
      codigo_original:i.codigo_original,descricao:i.descricao,marca:i.marca,unidade:i.unidade,quantidade:i.quantidade,preco_unitario:i.preco_unitario,total:i.total,
      escolhido:i.escolhido!==false,grupo_opcao:i.grupo_opcao,opcao_confirmada:!!i.opcao_confirmada,sob_encomenda:!!i.sob_encomenda}));
    const {error:e2}=await sb.from('orcamento_itens').insert(rows); if(e2) erro(e2);
  }
  if(CAPA.c.status==='Aberta'){await sb.from('capas').update({status:'Em orçamento'}).eq('id',CAPA.c.id);CAPA.c.status='Em orçamento';}
  await sb.from('atividades').insert({capa_id:CAPA.c.id,obra_id:CAPA.ob.id,usuario_id:EU.id,loja_id:CAPA.c.loja_id,tipo:'Orçamento enviado',
    resumo:`Orçamento ${reg.numero_santri||''} (${reg.momento}) — PDF ${brl(reg.valor_total_pdf)}, provável ${brl(reg.valor_provavel)}`});
  toast('Orçamento salvo'); abaOrc(); atualizarResumo(); return true;
}

// ================= PARÂMETROS (direção) =================
async function telaParametros(){
  if(!ehDirecao()) return telaLista();
  const [{data:ps},{data:tx}]=await Promise.all([sb.from('parametros_loja').select('*').order('loja_id'),sb.from('taxas_cartao').select('*').eq('ativo',true).order('bandeira').order('id')]);
  const campos=[['pis','PIS',1],['cofins','COFINS',1],['icms_debito','ICMS débito (venda)',1],['icms_credito_padrao','ICMS crédito padrão (compra)',1],['comissao_vendedor','Comissão vendedor',1],
    ['rt_arquiteto','RT arquiteto',1],['goyases','Goyases / Metropolitano',1],['taxa_loja_juros_cliente','Taxa da maquininha no "juros do cliente" (vazio = crédito 1x)',1],
    ['taxa_juros_cliente_am','Juros ao cliente % a.m. (estimativa p/ parcela)',1],['frete_rs_ton_ceramica','Frete R$/ton cerâmica',0],['frete_rs_ton_argamassa','Frete R$/ton argamassa',0],['pe_mc_mensal','Ponto de equilíbrio (MC R$/mês)',0]];
  const bandeiras=[...new Set((tx||[]).map(t=>t.bandeira))];
  $('#conteudo').innerHTML=`<h2 style="color:var(--navy)">Parâmetros</h2>
  <div class="g2">${(ps||[]).map(p=>`<div class="card"><h3>${esc(LOJAS.find(l=>l.id===p.loja_id)?.codigo)} – ${esc(LOJAS.find(l=>l.id===p.loja_id)?.nome)}</h3>
    ${campos.map(([f,t,isPct])=>`<label>${t}${isPct?' (%)':''}</label><input type="number" step="0.01" data-par="${p.loja_id}" data-f="${f}" data-pct="${isPct}" value="${p[f]==null?'':isPct?(p[f]*100).toFixed(2):p[f]}">`).join('')}
    ${p.observacao?`<p class="mut">${esc(p.observacao)}</p>`:''}</div>`).join('')}</div>
  <div class="card"><h3>Taxas de cartão</h3>
    <p class="mut">Alterar uma taxa cria uma nova versão com a data de hoje (as negociações antigas ficam com a taxa da época).</p>
    ${bandeiras.map(b=>`<details><summary><b>${esc(b)}</b> (${tx.filter(t=>t.bandeira===b).length})</summary><table>${tx.filter(t=>t.bandeira===b).map(t=>`<tr><td>${esc(t.modalidade)}</td><td><input type="number" step="0.01" style="width:110px" data-tx="${t.id}" value="${(t.taxa*100).toFixed(2)}"> %</td><td class="mut">desde ${dBR(t.vigente_desde)}</td></tr>`).join('')}</table></details>`).join('')||'<p class="mut">Nenhuma taxa cadastrada.</p>'}
    <details style="margin-top:12px"><summary><b>Colar tabela nova inteira</b> (substitui todas as taxas)</summary>
      <p class="mut">Uma linha por taxa: <code>Bandeira;Modalidade;Taxa%</code> — ex.: <code>Visa/Master;Crédito 03x;5,12</code>. Dá para copiar direto do Excel (colunas separadas por tabulação também funcionam).</p>
      <textarea id="txCola" style="min-height:160px"></textarea><button class="gold" id="txSubst" style="margin-top:8px">Substituir taxas</button></details></div>`;
  document.querySelectorAll('[data-par]').forEach(el=>el.onchange=async()=>{let v=el.value===''?null:Number(el.value.replace(',','.'));if(v!=null&&el.dataset.pct==='1')v=v/100;
    const {error}=await sb.from('parametros_loja').update({[el.dataset.f]:v,atualizado_em:new Date().toISOString()}).eq('loja_id',el.dataset.par);if(error)return erro(error);toast('Salvo ✓');});
  document.querySelectorAll('[data-tx]').forEach(el=>el.onchange=async()=>{const old=tx.find(t=>t.id==el.dataset.tx);const v=Number(el.value.replace(',','.'))/100;
    const {error:e1}=await sb.from('taxas_cartao').insert({bandeira:old.bandeira,modalidade:old.modalidade,parcelas:old.parcelas,taxa:v});if(e1)return erro(e1);
    await sb.from('taxas_cartao').update({ativo:false}).eq('id',old.id); toast('Taxa atualizada'); telaParametros();});
  $('#txSubst').onclick=async()=>{
    const linhas=$('#txCola').value.split(/\r?\n/).map(l=>l.split(/;|\t/).map(x=>x.trim())).filter(l=>l.length>=3&&l[0]&&l[2]);
    if(!linhas.length) return toast('Nenhuma linha válida');
    const regs=linhas.map(([b,m,t])=>({bandeira:b,modalidade:m,parcelas:(m.match(/(\d+)x/)||[])[1]?+(m.match(/(\d+)x/)[1]):null,taxa:Number(String(t).replace('%','').replace(',','.'))/(String(t).includes('%')||Number(String(t).replace(',','.'))>1?100:1)}));
    if(!confirm(`Substituir todas as taxas por ${regs.length} linhas?`)) return;
    const {error:e1}=await sb.from('taxas_cartao').update({ativo:false}).eq('ativo',true); if(e1) return erro(e1);
    const {error:e2}=await sb.from('taxas_cartao').insert(regs); if(e2) return erro(e2); toast(regs.length+' taxas cadastradas'); telaParametros(); };
}

// ---------- Pedido (PDF do pedido do Santri = a venda de verdade) ----------
let PED=null;
const normCond=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function abaPed(){
  const [{data:peds},{data:conds},{data:tx},{data:orcs},{data:arq}]=await Promise.all([
    sb.from('pedidos').select('*').eq('capa_id',CAPA.c.id).order('data_fechamento',{ascending:false}),
    sb.from('condicoes_pagamento').select('*').eq('ativo',true).order('nome'),
    sb.from('taxas_cartao').select('bandeira,modalidade').eq('ativo',true).order('id'),
    sb.from('orcamentos').select('id,numero_santri,versao,status').eq('capa_id',CAPA.c.id),
    sb.from('obra_pessoas').select('papel').eq('obra_id',CAPA.ob.id).eq('papel','Arquiteto / designer')]);
  PED={peds:peds||[],conds:conds||[],tx:tx||[],orcs:orcs||[],temArq:(arq||[]).length>0||!!CAPA.ob.escritorio_id,novo:null};
  $('#aba').innerHTML=`
   ${CAPA.podeEditar?`<div class="card"><h3>Subir pedido do Santri</h3>
     <p class="mut" style="margin-top:-4px">Quando o cliente fechar, lance o pedido no Santri e suba o PDF aqui. O sistema liga o pedido ao orçamento de mesmo número, calcula a margem real e marca a capa como ganha.</p>
     <div id="pedDrop" class="drop" style="border:2px dashed #aab4c0;border-radius:10px;padding:24px;text-align:center;cursor:pointer;color:var(--mut)">Arraste o PDF do pedido aqui ou clique para escolher</div>
     <input type="file" id="pedFile" accept="application/pdf" class="hide"><div id="pedRev"></div></div>`:''}
   <div class="card"><h3>Pedidos desta capa</h3>${listaPeds()}</div>`;
  if(CAPA.podeEditar){ const d=$('#pedDrop'); d.onclick=()=>$('#pedFile').click();
    d.ondragover=e=>{e.preventDefault();d.style.borderColor='var(--gold)'}; d.ondragleave=()=>d.style.borderColor='#aab4c0';
    d.ondrop=e=>{e.preventDefault();d.style.borderColor='#aab4c0';if(e.dataTransfer.files[0])lerPedido(e.dataTransfer.files[0])};
    $('#pedFile').onchange=e=>{if(e.target.files[0])lerPedido(e.target.files[0])}; }
  ligarListaPeds();
}
function listaPeds(){
  if(!PED.peds.length) return '<p class="mut">Nenhum pedido ainda.</p>';
  return `<div class="tbl"><table><tr><th>Pedido</th><th>Fechamento</th><th>Condição</th><th style="text-align:right">Total</th><th style="text-align:right">Margem de contribuição</th><th>Situação</th><th></th></tr>
  ${PED.peds.map(p=>{const r=p.resultado||{};return `<tr style="${p.status==='Cancelado'?'opacity:.5':''}"><td><b>${esc(p.numero_santri)}</b>${p.orcamento_id?'':' <span class="mut">(sem orçamento)</span>'}</td><td>${dBR(p.data_fechamento)}</td>
    <td>${esc(p.condicao_texto||'')}${p.bandeira&&p.bandeira!=='Boleto'?' <span class="mut">· '+esc(p.bandeira)+'</span>':''}</td><td style="text-align:right">${brl(p.total_pedido)}</td>
    <td style="text-align:right"><b>${brl(r.mc)}</b> <span class="mut">${pct(r.mc_pct)}</span></td><td>${esc(p.status)}</td>
    <td style="white-space:nowrap">${p.arquivo_path?`<button class="link" data-ppdf="${esc(p.arquivo_path)}">PDF</button>`:''} <button class="link" data-pver="${p.id}">itens</button>
      ${ehDirecao()&&p.status!=='Cancelado'?`<button class="link" style="color:#b33" data-pcanc="${p.id}">cancelar</button>`:''}</td></tr>
    <tr class="hide" id="pit_${p.id}"><td colspan="7"></td></tr>`}).join('')}</table></div>`;
}
function ligarListaPeds(){
  document.querySelectorAll('[data-ppdf]').forEach(b=>b.onclick=async()=>{const {data,error}=await sb.storage.from('capas').createSignedUrl(b.dataset.ppdf,600);if(error)return erro(error);window.open(data.signedUrl,'_blank');});
  document.querySelectorAll('[data-pcanc]').forEach(b=>b.onclick=async()=>{if(!confirm('Cancelar este pedido? Ele sai da margem do mês.'))return;
    const {error}=await sb.from('pedidos').update({status:'Cancelado'}).eq('id',b.dataset.pcanc); if(error) return erro(error); toast('Pedido cancelado'); abaPed();});
  document.querySelectorAll('[data-pver]').forEach(b=>b.onclick=async()=>{const tr=$('#pit_'+b.dataset.pver); if(!tr.classList.contains('hide')){tr.classList.add('hide');return;}
    const p=PED.peds.find(x=>x.id===b.dataset.pver); const {data:its}=await sb.from('pedido_itens').select('*').eq('pedido_id',p.id).order('ordem'); const by={}; (p.resultado?.itens||[]).forEach(x=>by[x.ref]=x);
    tr.firstElementChild.innerHTML=`<table><tr><th>Ambiente</th><th>Produto</th><th>Qtd</th><th style="text-align:right">Preço un.</th><th style="text-align:right">Total</th><th style="text-align:right">MC</th><th style="text-align:right">MC %</th></tr>${its.map(i=>{const x=by[i.ordem]||{};return `<tr><td class="mut">${esc(i.ambiente||'')}</td><td>${esc(i.descricao)}</td><td>${Number(i.quantidade).toLocaleString('pt-BR')} ${esc(i.unidade||'')}</td><td style="text-align:right">${brl(i.preco_unitario)}</td><td style="text-align:right">${brl(i.total)}</td><td style="text-align:right">${brl(x.mc)}</td><td style="text-align:right">${x.mc!=null&&i.total?pct(x.mc/i.total):''}</td></tr>`}).join('')}</table>`;
    tr.classList.remove('hide');});
}
async function lerPedido(file){
  $('#pedRev').innerHTML='<p class="mut">Lendo o PDF…</p>';
  let r; try{ const pdfjs=await carregarPdfjs(); r=await lerOrcamentoPDF(pdfjs,new Uint8Array(await file.arrayBuffer())); }catch(e){ $('#pedRev').innerHTML=`<div class="aviso">${esc(e.message)}</div>`; return; }
  const c=r.cabecalho;
  if(!c.eh_pedido){ $('#pedRev').innerHTML='<div class="aviso">Este PDF parece ser um <b>orçamento</b>, não um pedido (não tem "Data de fechamento"). Orçamentos vão na aba Orçamentos.</div>'; return; }
  const lojaCod=LOJAS.find(l=>l.id===CAPA.c.loja_id)?.codigo;
  const avisos=[];
  if(c.loja&&lojaCod&&c.loja!==lojaCod) avisos.push(`O pedido é da loja <b>${esc(c.loja)}</b> e a capa é da loja <b>${esc(lojaCod)}</b>.`);
  const {data:dup}=await sb.from('pedidos').select('id,capa_id').eq('loja_id',CAPA.c.loja_id).eq('numero_santri',c.numero).neq('status','Cancelado');
  if(dup&&dup.length){ $('#pedRev').innerHTML=`<div class="aviso">O pedido ${esc(c.numero)} já foi lançado${dup[0].capa_id===CAPA.c.id?' nesta capa':' em outra capa'}.</div>`; return; }
  const orc=PED.orcs.filter(o=>o.numero_santri===c.numero).sort((a,b)=>(a.status==='Substituído (nova versão)')-(b.status==='Substituído (nova versão)'))[0]||null;
  if(!orc) avisos.push(`Não achei nesta capa o orçamento nº ${esc(c.numero)}. O pedido fica ligado só à capa (confira se é a capa certa).`);
  const cond=PED.conds.find(x=>normCond(x.nome)===normCond(c.condicao_pagamento))||null;
  if(!cond) avisos.push(`A condição "${esc(c.condicao_pagamento||'')}" não está no cadastro de condições. Escolha a mais parecida abaixo.`);
  PED.novo={file,r,orc,itens:r.itens.map((i,ix)=>({...i,ref:ix+1}))};
  const bands=[...new Set(PED.tx.map(t=>t.bandeira))];
  const tot=r.totais||{};
  $('#pedRev').innerHTML=`<div style="margin-top:12px">
    ${avisos.map(a=>`<div class="aviso">${a}</div>`).join('')}
    <div class="kpis"><div class="kpi"><b>${esc(c.numero)}</b><span>pedido${orc?' · orçamento ligado':''}</span></div><div class="kpi"><b>${dBR(c.data_fechamento)}</b><span>fechamento</span></div>
      <div class="kpi"><b>${brl(r.total_geral)}</b><span>total do pedido${tot['Valor desconto']?' (desconto '+brl(tot['Valor desconto'])+')':''}</span></div><div class="kpi"><b>${r.itens.length}</b><span>itens</span></div></div>
    <p class="mut">Cliente: ${esc(c.cliente||'')} · Vendedor Santri: ${esc(c.vendedor||'')}${c.observacao?' · Obs.: '+esc(c.observacao):''}</p>
    <div class="g3"><div><label>Condição de pagamento (Santri)</label><select id="pCond"><option value="">—</option>${PED.conds.map(x=>`<option value="${x.codigo}" ${cond&&cond.codigo===x.codigo?'selected':''}>${esc(x.nome)}</option>`).join('')}</select></div>
      <div id="pBandBox"><label>Bandeira / tabela</label><select id="pBand"><option value="">—</option>${bands.map(b=>`<option>${esc(b)}</option>`).join('')}</select></div>
      <div id="pModBox"><label>Modalidade</label><select id="pMod"></select></div>
      <div id="pEntBox"><label>Entrada (R$)</label><input id="pEnt" inputmode="decimal" value="0"></div>
      <div id="pTxBox"><label>Custo financeiro (% do valor a prazo)</label><input id="pTx" inputmode="decimal" placeholder="ex.: 2,5"></div>
      <div style="align-self:end"><label style="display:flex;gap:6px;align-items:center;color:var(--txt)"><input type="checkbox" id="pArq" style="width:auto" ${PED.temArq?'checked':''}> Tem arquiteto (RT)</label>
        <label style="display:flex;gap:6px;align-items:center;color:var(--txt)"><input type="checkbox" id="pGoy" style="width:auto" ${PED.temArq?'checked':''}> Goyases / Metropolitano</label></div></div>
    <div id="pCondObs"></div><div id="pRes" style="margin-top:10px"></div>
    <div class="linha" style="margin-top:10px"><button class="gold" id="pSalvar">Confirmar pedido</button><button class="sec" id="pCanc">Cancelar</button></div></div>`;
  const pn=v=>{v=String(v||'').trim(); if(!v) return null; if(v.includes(',')) v=v.replace(/\./g,'').replace(',','.'); const n=Number(v.replace('%','')); return isNaN(n)?null:n;};
  const preencherMod=(sel)=>{const b=$('#pBand').value; const ms=PED.tx.filter(t=>t.bandeira===b).map(t=>t.modalidade); $('#pMod').innerHTML=ms.map(m=>`<option ${m===sel?'selected':''}>${esc(m)}</option>`).join(''); $('#pModBox').classList.toggle('hide',!ms.length);};
  const aplicarCond=()=>{ const cd=PED.conds.find(x=>String(x.codigo)===$('#pCond').value);
    const usaTab=cd&&cd.bandeira; $('#pBand').value=usaTab?cd.bandeira:(cd&&cd.forma==='avista'?'':$('#pBand').value); preencherMod(cd?.modalidade);
    $('#pEntBox').classList.toggle('hide',!(cd&&cd.tem_entrada));
    $('#pTxBox').classList.toggle('hide',!!(cd&&(cd.bandeira||cd.forma==='avista')));
    if(cd&&cd.taxa_manual!=null) $('#pTx').value=String(cd.taxa_manual*100).replace('.',',');
    $('#pCondObs').innerHTML=cd?.observacao?`<p class="mut">${esc(cd.observacao)}${cd.conferido?'':' <b>(a direção ainda não conferiu esta condição)</b>'}</p>`:''; recalcPed(); };
  $('#pCond').onchange=aplicarCond; $('#pBand').onchange=()=>{preencherMod();recalcPed();};
  ['pMod','pArq','pGoy'].forEach(i=>$('#'+i).onchange=recalcPed); ['pEnt','pTx'].forEach(i=>$('#'+i).onchange=recalcPed);
  $('#pCanc').onclick=()=>{PED.novo=null;$('#pedRev').innerHTML='';};
  $('#pSalvar').onclick=salvarPedido;
  PED.pn=pn; aplicarCond();
}
function entradaPed(){
  const pn=PED.pn; const cd=PED.conds.find(x=>String(x.codigo)===$('#pCond').value);
  const band=$('#pBand').value||'PIX'; const tx=pn($('#pTx').value);
  const pag={entrada_valor:$('#pEntBox').classList.contains('hide')?0:(pn($('#pEnt').value)||0),bandeira:band,modalidade:$('#pMod').value||'',modo:'loja'};
  if(!$('#pTxBox').classList.contains('hide')) pag.taxa=tx==null?0:tx/100;
  return {cd,ent:{loja_id:CAPA.c.loja_id,arquiteto:$('#pArq').checked,goyases:$('#pGoy').checked,frete_cliente:0,desconto_pct:0,pagamento:pag,
    itens:PED.novo.itens.map(i=>({produto_id:i.produto_id!=null?String(i.produto_id):null,ref:i.ref,descricao:i.descricao,quantidade:i.quantidade,preco_total:i.total}))}};
}
async function recalcPed(){
  if(!PED?.novo) return; const {ent}=entradaPed();
  const {data:r,error}=await sb.rpc('calcular_negociacao',{p:ent}); if(error) return erro(error); PED.novo.res=r; PED.novo.ent=ent;
  const cor=r.mc_pct>=0.18?'var(--ok)':r.mc_pct>=0.12?'var(--morna)':'var(--quente)';
  let comp=''; if(PED.novo.orc){ const {data:ng}=await sb.from('negociacoes').select('resultado,atualizado_em').eq('orcamento_id',PED.novo.orc.id).order('atualizado_em',{ascending:false}).limit(1);
    if(ng&&ng[0]) comp=`<div class="kpi"><b>${pct(ng[0].resultado?.mc_pct)}</b><span>MC da última negociação simulada</span></div>`; }
  $('#pRes').innerHTML=`<div class="kpis"><div class="kpi"><b>${brl(r.receita)}</b><span>valor do pedido</span></div><div class="kpi"><b style="color:${cor}">${brl(r.mc)}</b><span>margem de contribuição real</span></div>
     <div class="kpi"><b style="color:${cor}">${pct(r.mc_pct)}</b><span>MC %</span></div><div class="kpi"><b>${pct(r.taxa_cartao)}</b><span>custo financeiro (${brl(r.custo_financeiro)})</span></div>${comp}</div>
     ${(r.avisos||[]).map(a=>`<div class="aviso">${esc(a)}</div>`).join('')}`;
}
async function salvarPedido(){
  const n=PED.novo; if(!n?.res) return toast('Aguarde o cálculo');
  const {cd,ent}=entradaPed(); if(!cd&&!confirm('Salvar sem condição de pagamento cadastrada?')) return;
  $('#pSalvar').disabled=true; const c=n.r.cabecalho, tot=n.r.totais||{};
  let path=null; const up=`${CAPA.c.id}/${Date.now()}_pedido_${(c.numero||'').replace(/\D/g,'')}.pdf`;
  const {error:eUp}=await sb.storage.from('capas').upload(up,n.file,{contentType:'application/pdf'}); if(!eUp) path=up;
  const reg={capa_id:CAPA.c.id,orcamento_id:n.orc?.id||null,loja_id:CAPA.c.loja_id,numero_santri:c.numero,data_fechamento:c.data_fechamento,data_emissao:c.data_emissao,
    vendedor_santri:c.vendedor,cliente_pdf:c.cliente,cliente_codigo:c.cliente_codigo,condicao_texto:c.condicao_pagamento,condicao_codigo:cd?.codigo||null,
    entrada_valor:ent.pagamento.entrada_valor,bandeira:ent.pagamento.bandeira,modalidade:ent.pagamento.modalidade,taxa_manual:ent.pagamento.taxa??null,
    arquiteto:ent.arquiteto,goyases:ent.goyases,total_produtos:tot['Total produtos']??null,desconto:tot['Valor desconto']??0,total_pedido:n.r.total_geral,
    observacao:c.observacao,arquivo_path:path,resultado:n.res,criado_por:EU.id};
  const {data:p,error}=await sb.from('pedidos').insert(reg).select().single();
  if(error){ $('#pSalvar').disabled=false; return erro(error.code==='23505'?{message:'Este pedido já foi lançado.'}:error); }
  const ids=[...new Set(n.itens.map(i=>i.produto_id).filter(Boolean))];
  const {data:ex}=ids.length?await sb.from('produtos').select('id').in('id',ids):{data:[]}; const ok=new Set((ex||[]).map(x=>x.id));
  const {error:e2}=await sb.from('pedido_itens').insert(n.itens.map(i=>({pedido_id:p.id,ordem:i.ref,ambiente:i.ambiente,produto_id:ok.has(i.produto_id)?i.produto_id:null,codigo_original:i.codigo_original,
    descricao:i.descricao,marca:i.marca,unidade:i.unidade,quantidade:i.quantidade,preco_unitario:i.preco_unitario,total:i.total}))); if(e2) erro(e2);
  if(n.orc) await sb.from('orcamentos').update({status:'Ganho'}).eq('id',n.orc.id);
  await sb.from('capas').update({status:'Ganha (virou pedido)'}).eq('id',CAPA.c.id); CAPA.c.status='Ganha (virou pedido)';
  await sb.from('atividades').insert({capa_id:CAPA.c.id,obra_id:CAPA.ob.id,usuario_id:EU.id,loja_id:CAPA.c.loja_id,tipo:'Outro',
    resumo:`Pedido ${c.numero} fechado: ${brl(n.res.receita)} · MC ${pct(n.res.mc_pct)} · ${c.condicao_pagamento||''}`});
  toast('Pedido lançado'); PED.novo=null; abaPed(); if(typeof atualizarResumo==='function') atualizarResumo();
}

// ---------- Condições de pagamento do Santri (de-para para a taxa que a loja paga) ----------
let CDF={so:'pend',busca:''};
async function telaCondicoes(){
  if(!ehDirecao()) return telaLista();
  const [{data:cs,error},{data:tx}]=await Promise.all([sb.from('condicoes_pagamento').select('*').order('nome'),sb.from('taxas_cartao').select('bandeira,modalidade,taxa').eq('ativo',true).order('id')]);
  if(error) return erro(error);

     <td><input type="checkbox" data-f="conferido" style="width:auto" ${c.conferido?'checked':''}></td></tr>`).join('')||'<tr><td colspan="8" class="mut">Nada aqui.</td></tr>'}</table></div></div>`;

async function vincularProf(tipo,p){
  const {error}=await sb.from('obra_pessoas').insert({obra_id:CAPA.ob.id,pessoa_id:p.id,papel:PROF[tipo].papel,decide:false});
  if(error&&!/duplicate/i.test(error.message)) return erro(error);
  // arquiteta de escritório: se a obra ainda não tem escritório, já vincula
  if(tipo==='arq'&&p.escritorio_id&&!CAPA.ob.escritorio_id){ await sb.from('obras').update({escritorio_id:p.escritorio_id}).eq('id',CAPA.ob.id); CAPA.ob.escritorio_id=p.escritorio_id; }
  toast('Vinculado à obra');
}
async function sugProf(tipo,txt,box,onPick,opts={}){
  txt=(txt||'').trim(); if(txt.length<2){box.classList.add('hide');return;}
  const t=txt.replace(/[%,()]/g,''), dig=txt.replace(/\D/g,'');
  let data;
  if(tipo==='escr'){ ({data}=await sb.from('escritorios').select('id,nome,cidade').ilike('nome','%'+t+'%').eq('ativo',true).order('nome').limit(8)); }
  else { let q=sb.from('pessoas').select('id,nome,whatsapp,profissao,escritorio_id,escritorio:escritorios(nome)').eq('profissional',true).in('profissao',PROF[tipo].profs).order('nome').limit(8);
    q=dig.length>=4?q.or(`whatsapp.ilike.*${dig}*,nome.ilike.*${t}*`):q.ilike('nome','%'+t+'%'); ({data}=await q); }
  box.classList.remove('hide');
  box.innerHTML=(data||[]).map((p,i)=>`<div data-i="${i}"><b>${esc(p.nome)}</b> <span class="mut">${esc(p.profissao||p.cidade||'')}${p.escritorio?' · '+esc(p.escritorio.nome):''}${p.whatsapp?' · '+esc(p.whatsapp):''}</span></div>`).join('')
    +`<div data-novo="1" style="color:var(--navy)"><b>+ Novo cadastro:</b> ${esc(txt)}</div>`;
  box.querySelectorAll('[data-i]').forEach(d=>d.onclick=()=>{box.classList.add('hide');onPick(data[+d.dataset.i]);});
  box.querySelector('[data-novo]').onclick=async()=>{box.classList.add('hide');
    if(opts.criarDireto){ const {data:n,error}=await sb.from('escritorios').insert({nome:txt,criado_por:EU.id,loja_id:EU.loja_id}).select().single(); if(error) return toast(/unique|duplicate/i.test(error.message)?'Já existe um escritório com esse nome':'Erro: '+error.message); return onPick(n); }
    tipo==='escr'?formEscr({nome:txt},onPick):formProf({nome:txt,tipo},onPick);};
}

    document.querySelectorAll('[data-e]').forEach(r=>r.onclick=()=>formEscr({id:r.dataset.e},listaProf)); return;
  }
  let q=sb.from('pessoas').select('id,nome,whatsapp,profissao,data_nascimento,instagram,cidade,escritorio:escritorios(nome),obra_pessoas(obra_id)').eq('profissional',true).in('profissao',PROF[PFT.aba].profs).order('nome').limit(1000);
  const dig=b.replace(/\D/g,''); if(b) q=dig.length>=4?q.or(`whatsapp.ilike.*${dig}*,nome.ilike.*${b}*`):q.ilike('nome','%'+b+'%');
  const {data,error}=await q; if(error) return erro(error);
  const an=data.filter(p=>p.data_nascimento&&p.data_nascimento.slice(5,7)===mes).sort((a,c)=>a.data_nascimento.slice(8).localeCompare(c.data_nascimento.slice(8)));
  $('#pfAniv').innerHTML=an.length?`<div class="card" style="background:#fffaf0"><b>🎂 Aniversariantes do mês:</b> ${an.map(p=>`${esc(p.nome)} (${aniv(p.data_nascimento)})`).join(' · ')}</div>`:'';
  $('#pfLista').innerHTML=data.length?`<table><tr><th>Nome</th><th>Profissão</th><th>Escritório</th><th>WhatsApp</th><th>Aniversário</th><th>Obras</th></tr>${data.map(p=>`<tr style="cursor:pointer" data-p="${p.id}"><td><b>${esc(p.nome)}</b></td><td>${esc(p.profissao||'')}</td><td>${esc(p.escritorio?.nome||'')}</td><td>${esc(p.whatsapp||'')}</td><td>${aniv(p.data_nascimento)}</td><td>${(p.obra_pessoas||[]).length||''}</td></tr>`).join('')}</table>`:'<p class="mut">Nenhum cadastro ainda. Use "+ Novo cadastro".</p>';
  document.querySelectorAll('[data-p]').forEach(r=>r.onclick=()=>formProf({id:r.dataset.p},listaProf));
}

// ---------- Conferência de ST (Santri × lista de NCM do planilhão) ----------
const SIT_ST=['ST com % diferente','NCM de ST, Santri sem ST','ST no Santri, NCM fora da lista','Próximo (até 0,25 p.p.)','OK – ST confere','OK – não é ST'];
let CST={loja:1,sit:'ST com % diferente',busca:'',meses:12};
async function telaConfST(){
  if(!ehDirecao()) return telaLista();
  const [{data:res,error},{data:ncm},{data:parl}]=await Promise.all([sb.rpc('resumo_conferencia_st',{p_loja:CST.loja,p_meses:CST.meses||null}),sb.from('ncm_st').select('*').eq('loja_id',CST.loja).eq('ativo',true).order('ncm_prefixo'),sb.from('parametros_loja').select('icms_debito').eq('loja_id',CST.loja).maybeSingle()]);
  const icmsInt=Number(parl?.icms_debito||0.17); const p2=v=>(Number(v)*100).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';
  if(error) return erro(error);
  const tot=Object.values(res||{}).reduce((a,b)=>a+b,0);
  $('#conteudo').innerHTML=`<h2 style="margin:4px 0;color:var(--navy)">Conferência de ST</h2>
  <p class="mut">Compara o %ST cadastrado no Santri (arquivo de Formação de Preço importado) com a lista de NCMs de ST do planilhão. %ST esperado = (1 + MVA) × ICMS interno da loja − 7% (ou 12%) de ICMS da nota.</p>
  <div class="card"><div class="g3">
    <div><label>Loja</label><select id="cLoja">${LOJAS.map(l=>`<option value="${l.id}">${esc(l.codigo)} – ${esc(l.nome)}</option>`).join('')}</select></div>
    <div><label>Buscar (nome, marca, código, NCM)</label><input id="cBusca" value="${esc(CST.busca)}"></div>
    <div><label>Produtos</label><select id="cMeses"><option value="12">Só com preço formado nos últimos 12 meses</option><option value="24">Últimos 24 meses</option><option value="0">Todos (inclui os que só estão cadastrados)</option></select></div>
    <div style="align-self:end"><button class="sec" id="cCsv">Baixar lista (Excel/CSV)</button></div></div>
    <p class="mut" style="margin-top:6px">Muitos produtos aparecem em PVA só porque foram cadastrados para RV, sem formação de preço feita em PVA — por isso o padrão é olhar só os com preço formado recentemente.</p></div>
  ${tot?'':'<div class="aviso">Nenhum preço importado para esta loja ainda. Importe a Formação de Custo e Preço na Importadora.</div>'}
  <div class="kpis" style="margin-bottom:12px">${SIT_ST.map(k=>`<div class="kpi" data-sit="${esc(k)}" style="cursor:pointer;${CST.sit===k?'outline:2px solid var(--gold)':''}"><b class="${k.startsWith('OK')?'':'atras'}">${Number(res?.[k]||0).toLocaleString('pt-BR')}</b><span>${esc(k)}</span></div>`).join('')}</div>
  <div class="card"><h3>${esc(CST.sit)}</h3><div class="tbl" id="cLista"><p class="mut">Carregando…</p></div></div>
  <div class="card"><details><summary><b>NCMs com ST desta loja (${(ncm||[]).length})</b> — lista usada na conferência</summary>
    <div class="tbl"><table><tr><th>NCM (começa com)</th><th>MVA</th><th>%ST esperado (nota com 7%)</th><th>Obs.</th></tr>${(ncm||[]).map(n=>`<tr><td>${esc(n.ncm_prefixo)}</td><td>${p2(n.mva)}</td><td>${p2((1+Number(n.mva))*icmsInt-0.07)}</td><td class="mut">${esc(n.observacao||'')}</td></tr>`).join('')}</table></div>
    <p class="mut">Para atualizar: cole a lista inteira abaixo (uma linha por NCM: <code>NCM;MVA</code>, MVA em % ou decimal, ex.: <code>6907;46,15</code>). Substitui a lista desta loja.</p>
    <textarea id="ncmCola" style="min-height:120px"></textarea><button class="gold" id="ncmSubst" style="margin-top:8px">Substituir lista de NCM</button></details></div>`;
  $('#cLoja').value=CST.loja; $('#cMeses').value=String(CST.meses||0); $('#cMeses').onchange=e=>{CST.meses=+e.target.value;telaConfST();}; $('#cLoja').onchange=e=>{CST.loja=+e.target.value;telaConfST();};
  document.querySelectorAll('[data-sit]').forEach(k=>k.onclick=()=>{CST.sit=k.dataset.sit;telaConfST();});
  let t; $('#cBusca').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{CST.busca=e.target.value;listaConfST();},300)};
  $('#cCsv').onclick=csvConfST;
  $('#ncmSubst').onclick=async()=>{
    const regs=$('#ncmCola').value.split(/\r?\n/).map(l=>l.split(/;|\t/).map(x=>x.trim())).filter(l=>l.length>=2&&/^\d{2,8}$/.test(l[0].replace(/\./g,'')))
      .map(([n,m])=>{let v=Number(String(m).replace('%','').replace(',','.'));if(String(m).includes('%')||v>3)v=v/100;return {loja_id:CST.loja,ncm_prefixo:n.replace(/\./g,''),mva:v};});
    if(!regs.length) return toast('Nenhuma linha válida');
    const uniq=Object.values(Object.fromEntries(regs.map(r=>[r.ncm_prefixo,r])));
    if(!confirm(`Substituir a lista de NCM desta loja por ${uniq.length} NCMs?`)) return;
    const {error:e1}=await sb.from('ncm_st').delete().eq('loja_id',CST.loja); if(e1) return erro(e1);
    const {error:e2}=await sb.from('ncm_st').insert(uniq); if(e2) return erro(e2); toast(uniq.length+' NCMs cadastrados'); telaConfST();};
  listaConfST();
}
function qConfST(){ let q=sb.from('vw_conferencia_st').select('produto_id,nome,marca,ncm,ativo,pct_st,tipo_st,mva,st_esperado_7,st_esperado_12,diferenca_pp,preco_tabela_fabrica,data_preco,situacao').eq('loja_id',CST.loja).eq('situacao',CST.sit);
  if(CST.meses){const d=new Date();d.setMonth(d.getMonth()-CST.meses);q=q.gte('data_preco',d.toISOString().slice(0,10));}
  const b=CST.busca.trim().replace(/[%_,()]/g,''); if(b) q=/^\d+$/.test(b)?q.or(`produto_id.eq.${b},ncm.like.${b}*`):q.or(`nome.ilike.*${b}*,marca.ilike.*${b}*`); return q; }
async function listaConfST(){
  const {data,error}=await qConfST().order('marca').order('nome').limit(300); if(error) return erro(error);
  $('#cLista').innerHTML=data.length?`<table><tr><th>Cód.</th><th>Produto</th><th>Marca</th><th>NCM</th><th>%ST Santri</th><th>%ST esperado</th><th>Diferença</th><th>Data preço</th></tr>
   ${data.map(r=>`<tr><td>${r.produto_id}</td><td>${esc(r.nome)}${r.ativo?'':' <span class="mut">(inativo)</span>'}</td><td>${esc(r.marca||'')}</td><td>${esc(r.ncm||'')}</td>
     <td>${r.pct_st!=null?Number(r.pct_st).toLocaleString('pt-BR',{maximumFractionDigits:4})+'%':'—'}</td>
     <td>${r.st_esperado_7!=null?Number(r.st_esperado_7).toLocaleString('pt-BR',{maximumFractionDigits:4})+'%':'—'}</td>
     <td>${r.diferenca_pp!=null?(r.diferenca_pp>0?'+':'')+Number(r.diferenca_pp).toLocaleString('pt-BR',{maximumFractionDigits:2})+' p.p.':''}</td><td>${r.data_preco?dBR(r.data_preco):''}</td></tr>`).join('')}</table>
   ${data.length===300?'<p class="mut">Mostrando os 300 primeiros. Baixe a lista para ver todos.</p>':''}`:'<p class="mut">Nenhum item nesta situação.</p>';
}
async function csvConfST(){
  toast('Gerando lista…'); let tudo=[];
  for(let i=0;;i+=1000){ const {data,error}=await qConfST().order('produto_id').range(i,i+999); if(error) return erro(error); tudo=tudo.concat(data); if(data.length<1000) break; }
  const n=v=>v==null?'':String(v).replace('.',',');
  const csv=['Código;Produto;Marca;NCM;Ativo;%ST Santri;Tipo ST;MVA planilhão;%ST esperado (7%);%ST esperado (12%);Diferença p.p.;Preço tabela;Data preço;Situação']
    .concat(tudo.map(r=>[r.produto_id,`"${(r.nome||'').replace(/"/g,'""')}"`,r.marca||'',r.ncm||'',r.ativo?'Sim':'Não',n(r.pct_st),r.tipo_st||'',n(r.mva),n(r.st_esperado_7),n(r.st_esperado_12),n(r.diferenca_pp),n(r.preco_tabela_fabrica),r.data_preco||'',r.situacao].join(';'))).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));
  a.download=`conferencia_st_${LOJAS.find(l=>l.id===CST.loja)?.codigo}_${CST.sit.replace(/[^\wÀ-ú]+/g,'_')}.csv`; a.click();
}

// ---------- Linha do tempo ----------
async function abaTempo(){
  const {data:at}=await sb.from('atividades').select('*,usuario:usuarios(nome)').eq('capa_id',CAPA.c.id).order('data',{ascending:false});
  $('#aba').innerHTML=`
  <div class="card"><h3>Registrar contato</h3><div class="g3">
    <div><label>Data</label><input type="date" id="aData" value="${hoje()}"></div>
    <div><label>Atividade</label>${sel('tipo_atividade','','id="aTipo"')}</div>
    <div><label>Com quem</label><input id="aQuem"></div></div>
    <label>O que aconteceu</label><textarea id="aRes"></textarea>
    <label>Próximo passo combinado</label><input id="aProx">
    <button class="gold" id="aAdd" style="margin-top:10px">Registrar</button></div>
  <div class="card"><h3>Histórico</h3>
    ${(at||[]).map(a=>`<div class="item"><b>${dBR(a.data.slice(0,10))} · ${esc(a.tipo)}</b> <span class="mut">${esc(a.usuario?.nome||'')}${a.com_quem?' · com '+esc(a.com_quem):''}</span>
      ${a.resumo?`<div>${esc(a.resumo)}</div>`:''}${a.proximo_passo?`<div class="mut">Próximo: ${esc(a.proximo_passo)}</div>`:''}</div>`).join('')||'<p class="mut">Sem registros.</p>'}</div>`;
  $('#aAdd').onclick=async()=>{
    if(!$('#aTipo').value) return toast('Escolha a atividade');
    const {error}=await sb.from('atividades').insert({capa_id:CAPA.c.id,obra_id:CAPA.ob.id,usuario_id:EU.id,loja_id:CAPA.c.loja_id,tipo:$('#aTipo').value,
      data:$('#aData').value+'T12:00:00',com_quem:$('#aQuem').value||null,resumo:$('#aRes').value||null,proximo_passo:$('#aProx').value||null});
    if(error) return erro(error);
    if($('#aProx').value && CAPA.podeEditar){ await sb.from('capas').update({proximo_passo:$('#aProx').value}).eq('id',CAPA.c.id); }
    toast('Registrado'); if($('#aProx').value&&CAPA.podeEditar) abrirCapa(CAPA.c.id); else abaTempo();
  };
}

// ================= USUÁRIOS (direção) =================
async function telaUsuarios(){
  if(!ehDirecao()) return telaLista();
  const {data}=await sb.from('usuarios').select('*').order('ativo').order('nome');
  const papeis=['vendedor','gerente','direcao','admin','logistica','financeiro','compras'];
  $('#conteudo').innerHTML=`<h2 style="color:var(--navy)">Usuários</h2>
  <p class="mut">Quem cria acesso entra bloqueado. Marque "Ativo", escolha a loja e o papel para liberar.</p>
  <div class="card tbl"><table><tr><th>Nome</th><th>E-mail</th><th>Ativo</th><th>Loja</th><th>Papel</th></tr>
  ${(data||[]).map(u=>`<tr style="${u.ativo?'':'background:#fff8e6'}"><td>${esc(u.nome)}</td><td class="mut">${esc(u.email)}</td>
    <td><input type="checkbox" data-t="usuarios" data-f="ativo" data-id="${u.id}" ${u.ativo?'checked':''} ${u.id===EU.id?'disabled':''} style="width:22px;height:22px"></td>
    <td><select data-t="usuarios" data-f="loja_id" data-id="${u.id}"><option value=""></option>${LOJAS.map(l=>`<option value="${l.id}" ${l.id===u.loja_id?'selected':''}>${esc(l.codigo)}</option>`).join('')}</select></td>
    <td><select data-t="usuarios" data-f="papel" data-id="${u.id}" ${u.id===EU.id?'disabled':''}>${papeis.map(p=>`<option ${p===u.papel?'selected':''}>${p}</option>`).join('')}</select></td></tr>`).join('')}
  </table></div>`;
  ligarCampos($('#conteudo'));
}
</script>
